<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gundam Assemble — Unit Data Editor</title>
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;500;600;700&family=Share+Tech+Mono&family=Exo+2:wght@300;400;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.26.9/babel.min.js"></script>
<style>
:root {
  --bg-deep: #0a0c10;
  --bg-panel: #111520;
  --bg-card: #161b28;
  --bg-input: #0d1018;
  --border: #1e2940;
  --border-focus: #e63946;
  --accent: #e63946;
  --accent-glow: rgba(230, 57, 70, 0.3);
  --accent2: #00b4d8;
  --accent2-glow: rgba(0, 180, 216, 0.2);
  --text: #e8eaf0;
  --text-dim: #6b7394;
  --text-label: #8e95b4;
  --success: #06d6a0;
  --warning: #ffd166;
  --font-display: 'Rajdhani', sans-serif;
  --font-mono: 'Share Tech Mono', monospace;
  --font-body: 'Exo 2', sans-serif;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body, #root { height: 100%; }
body { background: var(--bg-deep); }

.app {
  font-family: var(--font-body);
  color: var(--text);
  min-height: 100vh;
  background: var(--bg-deep);
  background-image:
    radial-gradient(ellipse at 20% 0%, rgba(230,57,70,0.06) 0%, transparent 60%),
    radial-gradient(ellipse at 80% 100%, rgba(0,180,216,0.04) 0%, transparent 60%);
}

.header {
  padding: 20px 32px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  border-bottom: 1px solid var(--border);
  background: linear-gradient(180deg, rgba(22,27,40,0.95) 0%, var(--bg-deep) 100%);
}
.header-left { display: flex; align-items: center; gap: 16px; }
.logo-mark {
  width: 40px; height: 40px;
  background: var(--accent);
  clip-path: polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%);
  display: flex; align-items: center; justify-content: center;
}
.logo-mark-inner {
  width: 24px; height: 24px;
  background: var(--bg-deep);
  clip-path: polygon(50% 10%, 90% 30%, 90% 70%, 50% 90%, 10% 70%, 10% 30%);
}
.logo-text {
  font-family: var(--font-display);
  font-weight: 700;
  font-size: 24px;
  letter-spacing: 3px;
  text-transform: uppercase;
  color: var(--text);
}
.logo-sub {
  font-family: var(--font-mono);
  font-size: 10px;
  color: var(--text-dim);
  letter-spacing: 2px;
  margin-top: -2px;
}
.header-actions { display: flex; gap: 10px; flex-wrap: wrap; }

.btn {
  font-family: var(--font-display);
  font-weight: 600;
  font-size: 13px;
  letter-spacing: 1.5px;
  text-transform: uppercase;
  padding: 10px 20px;
  border: 1px solid var(--border);
  background: var(--bg-card);
  color: var(--text);
  cursor: pointer;
  transition: all 0.15s;
  clip-path: polygon(0 0, calc(100% - 8px) 0, 100% 8px, 100% 100%, 8px 100%, 0 calc(100% - 8px));
}
.btn:hover { border-color: var(--accent); background: rgba(230,57,70,0.08); }
.btn-primary { background: var(--accent); border-color: var(--accent); color: #fff; }
.btn-primary:hover { background: #c1303e; }
.btn-sm { padding: 6px 14px; font-size: 11px; clip-path: none; }
.btn-danger { border-color: #e63946; color: #e63946; }
.btn-danger:hover { background: rgba(230,57,70,0.15); }
.btn-accent2 { border-color: var(--accent2); color: var(--accent2); }
.btn-accent2:hover { background: var(--accent2-glow); }

.main { padding: 24px 32px; max-width: 1200px; margin: 0 auto; }

.unit-count {
  font-family: var(--font-mono);
  font-size: 12px;
  color: var(--text-dim);
  margin-bottom: 16px;
  padding-left: 4px;
}
.unit-grid { display: flex; flex-direction: column; gap: 8px; }
.unit-row {
  display: grid;
  grid-template-columns: 1fr 160px 80px 60px 60px auto;
  align-items: center;
  gap: 12px;
  padding: 14px 20px;
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-left: 3px solid var(--accent);
  cursor: pointer;
  transition: all 0.15s;
}
.unit-row:hover { border-color: var(--accent); background: rgba(230,57,70,0.04); }
.unit-name {
  font-family: var(--font-display);
  font-weight: 700;
  font-size: 16px;
  letter-spacing: 0.5px;
}
.unit-pilot { font-size: 12px; color: var(--text-dim); }
.unit-faction {
  font-family: var(--font-mono);
  font-size: 11px;
  color: var(--accent2);
  letter-spacing: 0.5px;
}
.unit-stat {
  font-family: var(--font-mono);
  font-size: 13px;
  text-align: center;
}
.unit-stat span { font-size: 9px; color: var(--text-dim); display: block; margin-bottom: 2px; text-transform: uppercase; letter-spacing: 1px; }
.unit-actions { display: flex; gap: 6px; }

.editor-backdrop {
  position: fixed; inset: 0; background: rgba(0,0,0,0.7);
  z-index: 100; display: flex; align-items: flex-start; justify-content: center;
  padding: 40px 20px; overflow-y: auto;
}
.editor {
  background: var(--bg-panel);
  border: 1px solid var(--border);
  width: 100%; max-width: 720px;
  clip-path: polygon(0 0, calc(100% - 16px) 0, 100% 16px, 100% 100%, 16px 100%, 0 calc(100% - 16px));
  padding: 0;
}
.editor-header {
  padding: 20px 28px;
  border-bottom: 1px solid var(--border);
  display: flex; justify-content: space-between; align-items: center;
}
.editor-title {
  font-family: var(--font-display);
  font-weight: 700;
  font-size: 20px;
  letter-spacing: 2px;
  text-transform: uppercase;
}
.editor-body { padding: 24px 28px; display: flex; flex-direction: column; gap: 20px; }
.editor-footer {
  padding: 16px 28px;
  border-top: 1px solid var(--border);
  display: flex; justify-content: flex-end; gap: 10px;
}

.field-group { display: flex; flex-direction: column; gap: 6px; }
.field-row { display: flex; gap: 12px; }
.field-row > .field-group { flex: 1; }

label {
  font-family: var(--font-display);
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 2px;
  text-transform: uppercase;
  color: var(--text-label);
}

input, textarea {
  font-family: var(--font-body);
  font-size: 14px;
  padding: 10px 14px;
  background: var(--bg-input);
  border: 1px solid var(--border);
  color: var(--text);
  outline: none;
  transition: border-color 0.15s;
}
input:focus, textarea:focus { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent-glow); }
textarea { resize: vertical; min-height: 50px; font-size: 13px; }

.section-label {
  font-family: var(--font-display);
  font-weight: 700;
  font-size: 14px;
  letter-spacing: 2px;
  text-transform: uppercase;
  color: var(--accent);
  padding-bottom: 6px;
  border-bottom: 1px solid var(--border);
  display: flex; justify-content: space-between; align-items: center;
}

.attack-block, .ability-block {
  background: var(--bg-card);
  border: 1px solid var(--border);
  padding: 16px;
  display: flex; flex-direction: column; gap: 10px;
  position: relative;
}
.attack-block { border-left: 3px solid var(--accent); }
.ability-block { border-left: 3px solid var(--accent2); }

.remove-btn {
  position: absolute; top: 8px; right: 8px;
  background: none; border: none; color: var(--text-dim);
  cursor: pointer; font-size: 18px; line-height: 1;
}
.remove-btn:hover { color: var(--accent); }

.effect-row { display: flex; gap: 8px; align-items: center; }
.effect-row input { flex: 1; }
.effect-add {
  font-family: var(--font-mono);
  font-size: 11px;
  color: var(--accent);
  cursor: pointer;
  background: none; border: none;
  padding: 4px 0;
}
.effect-add:hover { text-decoration: underline; }
.effect-remove {
  background: none; border: none; color: var(--text-dim);
  cursor: pointer; font-size: 16px;
}
.effect-remove:hover { color: var(--accent); }

.lua-modal-backdrop {
  position: fixed; inset: 0; background: rgba(0,0,0,0.8);
  z-index: 200; display: flex; align-items: center; justify-content: center;
  padding: 40px 20px;
}
.lua-modal {
  background: var(--bg-panel);
  border: 1px solid var(--border);
  width: 100%; max-width: 800px; max-height: 80vh;
  display: flex; flex-direction: column;
}
.lua-modal-header {
  padding: 16px 24px;
  border-bottom: 1px solid var(--border);
  display: flex; justify-content: space-between; align-items: center;
}
.lua-modal-body { padding: 0; flex: 1; overflow: auto; }
.lua-modal-footer {
  padding: 12px 24px;
  border-top: 1px solid var(--border);
  display: flex; justify-content: flex-end; gap: 10px;
}

.toast {
  position: fixed; bottom: 24px; right: 24px;
  background: var(--success);
  color: #000;
  font-family: var(--font-display);
  font-weight: 600;
  font-size: 13px;
  letter-spacing: 1px;
  padding: 12px 20px;
  z-index: 999;
  animation: slideIn 0.3s;
}
@keyframes slideIn { from { transform: translateY(20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }

.empty-state {
  text-align: center;
  padding: 80px 20px;
  color: var(--text-dim);
}
.empty-state-icon { font-size: 48px; margin-bottom: 16px; opacity: 0.3; }
.empty-state p {
  font-family: var(--font-mono);
  font-size: 13px;
  letter-spacing: 1px;
}

.search-bar { margin-bottom: 16px; }
.search-bar input {
  width: 100%;
  font-family: var(--font-mono);
  font-size: 13px;
  padding: 12px 16px;
  background: var(--bg-card);
  border: 1px solid var(--border);
  color: var(--text);
}
.search-bar input::placeholder { color: var(--text-dim); }

/* ---------- Card preview ---------- */
.editor { max-width: 1320px; }
.editor-columns { display: flex; gap: 28px; align-items: flex-start; }
.editor-form { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 20px; }
.editor-preview { width: 520px; flex-shrink: 0; position: sticky; top: 0; }
.preview-caption {
  font-family: var(--font-mono); font-size: 11px; color: var(--text-dim);
  letter-spacing: 1px; margin-bottom: 10px; display: flex; justify-content: space-between;
}
.preview-caption button {
  background: none; border: none; color: var(--accent2); cursor: pointer;
  font-family: var(--font-mono); font-size: 11px; letter-spacing: 1px;
}

.card.blue { outline: 4px solid rgba(40,110,255,0.9); }

.card-side.down { top: 9.6%;  height: 7.5%; background: #b71c1c; }

.card-stats {
  position: absolute; left: 6.5%; top: 1.6%; color: #fff; font-weight: 700; font-size: 17px;
  display: flex; gap: 16px; letter-spacing: 0.3px;
}
.card-tech { position: absolute; left: 6.5%; top: 11.5%; color: #fff; font-weight: 700; font-size: 12px; }
.card-name { position: absolute; left: 6.5%; top: 15.4%; right: 52%; color: #fff; font-weight: 700; font-size: 19px; line-height: 1; white-space: nowrap; }
.card-pilot { position: absolute; left: 6.5%; top: 23.6%; font-weight: 700; font-size: 11px; color: #111; }

.card-atk { position: absolute; top: 28.5%; height: 36%; width: 44%; overflow: hidden; display: flex; flex-direction: column; }

.card-pips { display: flex; gap: 9px; margin-bottom: 14px; }
.card-pip {
  flex: 1; background: #000; color: #fff; font-weight: 700; font-size: 17px;
  height: 24px; display: flex; align-items: center; gap: 6px; padding: 0 8px; border-radius: 2px;
}
.card-pip svg { width: 14px; height: 14px; fill: #fff; flex-shrink: 0; }
.card-atk-body { display: flex; gap: 8px; align-items: flex-start; flex: 1; min-height: 0; }

.card-atk-sp { flex-shrink: 0; align-self: stretch; display: flex; align-items: flex-start; justify-content: center; max-width: 52px; }

}

  .editor-body { padding: 16px; }

<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useRef, useEffect } = React;

const EMPTY_ATTACK = { name: "", cost: "", range: "", strength: "", sp_shape: "", effects: [""] };
const EMPTY_ABILITY = { name: "", keywords: "", description: "" };
const EMPTY_UNIT = {
  name: "", pilot: "", faction: "", splash_art: "", technical_name: "",
  hp: "", timeline: "", vp: "",
  attacks: [{ ...EMPTY_ATTACK, effects: [""] }],
  abilities: [],
};

function generateId() {
  return Math.random().toString(16).slice(2, 10);
}

function escapeStr(s) {
  return s.replace(/\\/g, "\\\\").replace(/"/g, '\\"');
}

function toLua(units) {
  const indent = (n) => "   ".repeat(n);
  let lines = ["return {"];
  units.forEach((u, ui) => {
    lines.push(`${indent(1)}{`);
    lines.push(`${indent(2)}name="${escapeStr(u.name)}",`);
    lines.push(`${indent(2)}pilot="${escapeStr(u.pilot)}",`);
    lines.push(`${indent(2)}faction="${escapeStr(u.faction)}",`);
    lines.push(`${indent(2)}technical_name="${escapeStr(u.technical_name)}",`);
    lines.push(`${indent(2)}splash_art="${escapeStr(u.splash_art)}",`);
    lines.push(`${indent(2)}hp="${u.hp}",`);
    lines.push(`${indent(2)}timeline="${u.timeline}",`);
    lines.push(`${indent(2)}vp="${u.vp}",`);
    lines.push(`${indent(2)}attacks={`);
    u.attacks.forEach((a) => {
      lines.push(`${indent(3)}{`);
      lines.push(`${indent(4)}name="${escapeStr(a.name)}",`);
      lines.push(`${indent(4)}cost="${escapeStr(a.cost)}",`);
      lines.push(`${indent(4)}range="${a.range}",`);
      lines.push(`${indent(4)}strength="${a.strength}",`);
      if (isSP(a.range) && a.sp_shape) lines.push(`${indent(4)}sp_shape="${a.sp_shape}",`);
      lines.push(`${indent(4)}effects={`);
      a.effects.forEach((e) => {
        if (e.trim()) lines.push(`${indent(5)}"${escapeStr(e.trim())}",`);
      });
      lines.push(`${indent(4)}}`);
      lines.push(`${indent(3)}},`);
    });
    lines.push(`${indent(2)}},`);
    lines.push(`${indent(2)}abilities={`);
    u.abilities.forEach((ab) => {
      lines.push(`${indent(3)}{`);
      lines.push(`${indent(4)}name="${escapeStr(ab.name)}",`);
      lines.push(`${indent(4)}keywords="${escapeStr(ab.keywords)}",`);
      lines.push(`${indent(4)}description="${escapeStr(ab.description)}"`);
      lines.push(`${indent(3)}},`);
    });
    lines.push(`${indent(2)}}`);
    lines.push(`${indent(1)}}${ui < units.length - 1 ? "," : ""}`);
  });
  lines.push("}");
  return lines.join("\n");
}

function parseLua(text) {
  try {
    const units = [];
    const inner = text.replace(/^return\s*\{/, "").replace(/\}\s*$/, "");
    let depth = 0; let start = -1; const blocks = [];
    for (let i = 0; i < inner.length; i++) {
      if (inner[i] === "{") { if (depth === 0) start = i; depth++; }
      if (inner[i] === "}") { depth--; if (depth === 0 && start >= 0) { blocks.push(inner.slice(start, i + 1)); start = -1; } }
    }
    for (const block of blocks) {
      const getStr = (key) => { const m = block.match(new RegExp(`${key}\\s*=\\s*"([^"]*)"`, "m")); return m ? m[1] : ""; };
      const unit = {
        _key: generateId(),
        name: getStr("name"),
        pilot: getStr("pilot"),
        faction: getStr("faction"),
        technical_name: getStr("technical_name"),
        splash_art: getStr("splash_art"),
        hp: getStr("hp"),
        timeline: getStr("timeline"),
        vp: getStr("vp"),
        attacks: [],
        abilities: [],
      };
      const attacksMatch = block.match(/attacks\s*=\s*\{([\s\S]*?)\}\s*,?\s*abilities/);
      if (attacksMatch) {
        let ad = 0; let as2 = -1; const aBlocks = [];
        const aStr = attacksMatch[1];
        for (let i = 0; i < aStr.length; i++) {
          if (aStr[i] === "{") { if (ad === 0) as2 = i; ad++; }
          if (aStr[i] === "}") { ad--; if (ad === 0 && as2 >= 0) { aBlocks.push(aStr.slice(as2, i + 1)); as2 = -1; } }
        }
        for (const ab of aBlocks) {
          const aGetStr = (key) => { const m = ab.match(new RegExp(`${key}\\s*=\\s*"([^"]*)"`, "m")); return m ? m[1] : ""; };
          const efMatch = ab.match(/effects\s*=\s*\{([\s\S]*?)\}/);
          const effects = [];
          if (efMatch) {
            const efStr = efMatch[1];
            const efItems = efStr.match(/"([^"]*)"/g);
            if (efItems) efItems.forEach(e => effects.push(e.replace(/"/g, "")));
          }
          if (effects.length === 0) effects.push("");
          unit.attacks.push({ name: aGetStr("name"), cost: aGetStr("cost"), range: aGetStr("range"), strength: aGetStr("strength"), sp_shape: aGetStr("sp_shape"), effects });
        }
      }
      if (unit.attacks.length === 0) unit.attacks.push({ ...EMPTY_ATTACK, effects: [""] });
      const abilitiesMatch = block.match(/abilities\s*=\s*\{([\s\S]*)\}\s*$/);
      if (abilitiesMatch) {
        let ad2 = 0; let as3 = -1; const abBlocks = [];
        const abStr = abilitiesMatch[1];
        for (let i = 0; i < abStr.length; i++) {
          if (abStr[i] === "{") { if (ad2 === 0) as3 = i; ad2++; }
          if (abStr[i] === "}") { ad2--; if (ad2 === 0 && as3 >= 0) { abBlocks.push(abStr.slice(as3, i + 1)); as3 = -1; } }
        }
        for (const abb of abBlocks) {
          const abGetStr = (key) => { const m = abb.match(new RegExp(`${key}\\s*=\\s*"([^"]*)"`, "m")); return m ? m[1] : ""; };
          unit.abilities.push({ name: abGetStr("name"), keywords: abGetStr("keywords"), description: abGetStr("description") });
        }
      }
      units.push(unit);
    }
    return units;
  } catch (e) {
    return null;
  }
}

function parseWiki(text) {
  try {
    // Parse the UnitInfo template
    const infoMatch = text.match(/\{\{UnitInfo([\s\S]*?)\}\}/);
    if (!infoMatch) return null;
    const infoBlock = infoMatch[1];
    const getField = (key) => {
      const m = infoBlock.match(new RegExp(`\\|${key}\\s*=\\s*(.*)`, "im"));
      return m ? m[1].trim() : "";
    };

    const unit = {
      _key: generateId(),
      name: getField("title"),
      pilot: getField("Pilot"),
      faction: getField("Faction"),
      technical_name: getField("caption"),
      splash_art: getField("image"),
      hp: getField("HP"),
      timeline: getField("Timeline"),
      vp: getField("VP"),
      attacks: [],
      abilities: [],
    };

    // Parse attacks section
    const attacksSection = text.match(/==\s*Attacks\s*==([\s\S]*?)(?===\s*Abilities\s*==)/);
    if (attacksSection) {
      const blockRegex = /===\s*(.+?)\s*===([\s\S]*?)(?=\n===|$)/g;
      let m;
      while ((m = blockRegex.exec(attacksSection[1])) !== null) {
        const atkName = m[1].trim();
        const body = m[2];
        const costMatch = body.match(/Cost:\s*(\S+)/i);
        const rangeMatch = body.match(/Range:\s*(\S+)/i);
        const strengthMatch = body.match(/Strength:\s*(\S+)/i);

        const effects = [];
        const effectMatch = body.match(/Effect:\s*([\s\S]*?)$/i);
        if (effectMatch) {
          const effectText = effectMatch[1].trim();
          const effectLines = effectText.split("\n").map(l => l.trim()).filter(l => l);
          effectLines.forEach(l => effects.push(l));
        }
        if (effects.length === 0) effects.push("");

        unit.attacks.push({
          name: atkName,
          cost: costMatch ? costMatch[1] : "",
          range: rangeMatch ? rangeMatch[1] : "",
          strength: strengthMatch ? strengthMatch[1] : "",
          sp_shape: "",
          effects,
        });
      }
    }
    if (unit.attacks.length === 0) unit.attacks.push({ ...EMPTY_ATTACK, effects: [""] });

    // Parse abilities section
    const abilitiesSection = text.match(/==\s*Abilities\s*==([\s\S]*?)(?=\[\[Category|$)/);
    if (abilitiesSection) {
      const blockRegex = /===\s*(.+?)\s*===([\s\S]*?)(?=\n===|$)/g;
      let m2;
      while ((m2 = blockRegex.exec(abilitiesSection[1])) !== null) {
        const abName = m2[1].trim();
        const bodyLines = m2[2].trim().split("\n").map(l => l.trim()).filter(l => l);
        
        let keywords = "";
        let descLines = [];
        let foundDesc = false;
        for (const line of bodyLines) {
          if (!foundDesc && /^\[.+\]$/.test(line.replace(/\]\s*\[/g, "]["))) {
            keywords = keywords ? keywords + line : line;
          } else {
            foundDesc = true;
            descLines.push(line);
          }
        }
        
        unit.abilities.push({
          name: abName,
          keywords: keywords,
          description: descLines.join("\n"),
        });
      }
    }

    return unit;
  } catch (e) {
    return null;
  }
}

// Colors for bracketed keywords on the card preview. Match is case-insensitive
// and by prefix, so "Range" also covers "[Range 3]". Edit freely.
const KEYWORD_COLORS = [
  { match: ["Command"],            color: "#2E2A80" },
  { match: ["Energy"],             color: "#EFC900" },
  { match: ["After Attack Roll"],  color: "#5BBB00" },
  { match: ["Before Attack Roll"], color: "#CD008B" },
  { match: ["After Combat Damage"], color: "#CD008B" },
  { match: ["Strength"],           color: "#B80B26" },
  { match: ["Critical"],           color: "#EB0000" },
  { match: ["Setup"],              color: "#009CE7" },
  { match: ["Disarm"],             color: "#8D008E" },
  { match: ["Shield"],             color: "#0081AD" },
  { match: ["Response"],           color: "#F45900" },
  { match: ["Ongoing"],            color: "#2E7D32" },
];
const KEYWORD_DEFAULT = "#6b6b6b";

// Images shown on the card when an attack's Range is "SP". Add more shapes here.
const SP_IMAGES = {
  Hammer: "https://steamusercontent-a.akamaihd.net/ugc/11484250575847956359/07E221E27C8F9A8A77613D8A995C4AAFA41DB0BC/",
  Flower: "https://steamusercontent-a.akamaihd.net/ugc/14776739453935694354/CE36582CC5E327F312E9DABE6627B7E6B96D1F66/",
  Cone:   "https://steamusercontent-a.akamaihd.net/ugc/10642514076363748008/0613929E2B9D9E0EA4B0C0746F3821753356E441/",
};
const isSP = (range) => String(range || "").trim().toUpperCase() === "SP";

function keywordColor(inner) {
  const t = inner.trim().toLowerCase();
  for (const k of KEYWORD_COLORS) {
    if (k.match.some(m => t.startsWith(m.toLowerCase()))) return k.color;
  }
  return KEYWORD_DEFAULT;
}

function renderKeywords(text) {
  if (!text) return null;
  return String(text).split(/(\[[^\]]+\])/g).map((part, i) => {
    if (part.startsWith("[") && part.endsWith("]")) {
      return <b key={i} style={{ color: keywordColor(part.slice(1, -1)) }}>{part}</b>;
    }
    return part;
  });
}

const ICON_COST = <svg viewBox="0 0 24 24"><path d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20zm0 18a8 8 0 1 1 0-16 8 8 0 0 1 0 16zm1-13h-2v6l5 3 1-1.7-4-2.3z"/></svg>;
const ICON_RANGE = <svg viewBox="0 0 24 24"><path d="M2 11h14.2l-3.6-3.6L14 6l6 6-6 6-1.4-1.4 3.6-3.6H2z"/></svg>;
const ICON_STR = <svg viewBox="0 0 24 24"><path d="M7 11V5a1.5 1.5 0 0 1 3 0v5h1V4a1.5 1.5 0 0 1 3 0v6h1V5a1.5 1.5 0 0 1 3 0v8.5c0 3.6-2.9 6.5-6.5 6.5H10c-2.2 0-4.2-1.3-5.2-3.2L3 13.4A1.5 1.5 0 0 1 5.6 12L7 14.5z"/></svg>;

function CardPreview({ unit, team }) {
  const has = (v) => v && String(v).trim();
  const attacks = unit.attacks.slice(0, 2);
  const abilities = unit.abilities.slice(0, 3);
  const pilotLine = [has(unit.pilot) ? unit.pilot : null, has(unit.faction) ? unit.faction : null].filter(Boolean).join(" - ");
  return (
    <div className={`card ${team}`}>
      <div className="card-art" style={has(unit.splash_art) ? { backgroundImage: `url("${unit.splash_art}")` } : {}} />
      <div className="card-side up" /><div className="card-side down" /><div className="card-side pin" />
      <div className="card-stats">
        <span>HP {has(unit.hp) ? unit.hp : "–"}</span>
        <span>VP {has(unit.vp) ? unit.vp : "–"}</span>
        <span>TL {has(unit.timeline) ? unit.timeline : "–"}</span>
      </div>
      <div className="card-tech">{unit.technical_name}</div>
      <div className={"card-name" + (has(unit.name) ? "" : " card-placeholder")}>{has(unit.name) ? unit.name : "Unit Name"}</div>
      <div className="card-pilot">{pilotLine}</div>

      {attacks.map((a, i) => (
        <div className={`card-atk a${i + 1}`} key={i}>
          <div className={"card-atk-name" + (has(a.name) ? "" : " card-placeholder")}>{has(a.name) ? a.name : "Attack"}</div>
          <div className="card-pips">
            <div className="card-pip">{ICON_COST}<span>{a.cost}</span></div>
            <div className="card-pip">{ICON_RANGE}<span>{a.range}</span></div>
            <div className="card-pip">{ICON_STR}<span>{a.strength}</span></div>
          </div>
          <div className={"card-atk-body" + (isSP(a.range) ? " sp" : "")}>
            <div className="card-atk-fx">
              {a.effects.filter(has).map((e, j) => <div key={j}>{renderKeywords(e)}</div>)}
            </div>
            {isSP(a.range) && (
              <div className="card-atk-sp">
                {SP_IMAGES[a.sp_shape]
                  ? <img src={SP_IMAGES[a.sp_shape]} alt={a.sp_shape} />
                  : <div className="card-atk-sp-empty">{a.sp_shape || "SP"}</div>}
              </div>
            )}
          </div>
        </div>
      ))}

      {abilities.map((ab, i) => (
        <div className={`card-ab b${i + 1}`} key={i}>
          <div className="card-ab-name">{ab.name}</div>
          <div className="card-ab-kw">{renderKeywords(ab.keywords)}</div>
          <div className="card-ab-desc">{renderKeywords(ab.description)}</div>
        </div>
      ))}
    </div>
  );
}

const GITHUB_UNITS_URL = "https://raw.githubusercontent.com/Zignoratio/gundamassemble/main/GundamAssembleUnits.lua";

function App() {
  const [units, setUnits] = useState([]);
  const [editing, setEditing] = useState(null);
  const [showLua, setShowLua] = useState(false);
  const [showImport, setShowImport] = useState(false);
  const [showWikiImport, setShowWikiImport] = useState(false);
  const [importText, setImportText] = useState("");
  const [wikiText, setWikiText] = useState("");
  const [toast, setToast] = useState("");
  const [search, setSearch] = useState("");
  const [previewTeam, setPreviewTeam] = useState("blue");
  const [loadingGithub, setLoadingGithub] = useState(false);
  const fileRef = useRef();
  const luaRef = useRef();

  const showToast = (msg) => { setToast(msg); setTimeout(() => setToast(""), 2500); };

  // Load the current unit list from GitHub. replace=true swaps the list out
  // (used on startup and by the RELOAD button); false appends.
  const loadFromGithub = async (replace = true) => {
    setLoadingGithub(true);
    try {
      const res = await fetch(GITHUB_UNITS_URL + "?t=" + Date.now(), { cache: "no-store" });
      if (!res.ok) throw new Error("HTTP " + res.status);
      const text = await res.text();
      const parsed = parseLua(text);
      if (parsed && parsed.length > 0) {
        setUnits(prev => replace ? parsed : [...prev, ...parsed]);
        showToast(`${parsed.length} UNIT(S) LOADED FROM GITHUB`);
      } else {
        showToast("GITHUB LOAD FAILED — CHECK LUA FORMAT");
      }
    } catch (e) {
      showToast("GITHUB LOAD FAILED — " + e.message);
    } finally {
      setLoadingGithub(false);
    }
  };

  useEffect(() => { loadFromGithub(true); }, []);

  const handleNew = () => {
    setEditing({ ...EMPTY_UNIT, _key: generateId(), attacks: [{ ...EMPTY_ATTACK, effects: [""] }], abilities: [] });
  };
  const handleEdit = (u) => { setEditing(JSON.parse(JSON.stringify(u))); };
  const handleDelete = (id) => { setUnits(prev => prev.filter(u => u._key !== id)); showToast("UNIT DELETED"); };
  const handleSave = () => {
    if (!editing.name.trim()) return;
    setUnits(prev => {
      const idx = prev.findIndex(u => u._key === editing._key);
      if (idx >= 0) { const next = [...prev]; next[idx] = editing; return next; }
      return [...prev, editing];
    });
    setEditing(null);
    showToast("UNIT SAVED");
  };
  const handleDuplicate = (u) => {
    const dup = JSON.parse(JSON.stringify(u));
    dup._key = generateId();
    dup.name = u.name + " (Copy)";
    setUnits(prev => [...prev, dup]);
    showToast("UNIT DUPLICATED");
  };
  const handleExport = () => setShowLua(true);
  const handleDownload = () => {
    try {
      const data = toLua(units);
      const dataUri = "data:text/plain;charset=utf-8," + encodeURIComponent(data);
      const a = document.createElement("a");
      a.href = dataUri;
      a.download = "units.lua";
      a.style.display = "none";
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      showToast("FILE DOWNLOADED");
    } catch (e) {
      showToast("DOWNLOAD FAILED — USE SELECT ALL + COPY");
    }
  };
  const handleImport = () => {
    const parsed = parseLua(importText);
    if (parsed && parsed.length > 0) {
      setUnits(prev => [...prev, ...parsed]);
      setShowImport(false);
      setImportText("");
      showToast(`${parsed.length} UNIT(S) IMPORTED`);
    } else {
      showToast("IMPORT FAILED — CHECK LUA FORMAT");
    }
  };
  const handleFileImport = (e) => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (ev) => {
      const parsed = parseLua(ev.target.result);
      if (parsed && parsed.length > 0) {
        setUnits(prev => [...prev, ...parsed]);
        showToast(`${parsed.length} UNIT(S) IMPORTED FROM FILE`);
      } else {
        showToast("IMPORT FAILED — CHECK LUA FORMAT");
      }
    };
    reader.readAsText(file);
    e.target.value = "";
  };
  const handleWikiImport = () => {
    const parsed = parseWiki(wikiText);
    if (parsed) {
      setUnits(prev => [...prev, parsed]);
      setShowWikiImport(false);
      setWikiText("");
      showToast("UNIT IMPORTED FROM WIKI");
    } else {
      showToast("IMPORT FAILED — CHECK WIKI FORMAT");
    }
  };

  const updateField = (key, val) => setEditing(prev => ({ ...prev, [key]: val }));
  const updateAttack = (idx, key, val) => {
    setEditing(prev => {
      const attacks = [...prev.attacks];
      attacks[idx] = { ...attacks[idx], [key]: val };
      return { ...prev, attacks };
    });
  };
  const updateEffect = (aidx, eidx, val) => {
    setEditing(prev => {
      const attacks = [...prev.attacks];
      const effects = [...attacks[aidx].effects];
      effects[eidx] = val;
      attacks[aidx] = { ...attacks[aidx], effects };
      return { ...prev, attacks };
    });
  };
  const addEffect = (aidx) => {
    setEditing(prev => {
      const attacks = [...prev.attacks];
      attacks[aidx] = { ...attacks[aidx], effects: [...attacks[aidx].effects, ""] };
      return { ...prev, attacks };
    });
  };
  const removeEffect = (aidx, eidx) => {
    setEditing(prev => {
      const attacks = [...prev.attacks];
      const effects = attacks[aidx].effects.filter((_, i) => i !== eidx);
      if (effects.length === 0) effects.push("");
      attacks[aidx] = { ...attacks[aidx], effects };
      return { ...prev, attacks };
    });
  };
  const addAttack = () => {
    if (editing.attacks.length < 2) {
      setEditing(prev => ({ ...prev, attacks: [...prev.attacks, { ...EMPTY_ATTACK, effects: [""] }] }));
    }
  };
  const removeAttack = (idx) => {
    setEditing(prev => ({ ...prev, attacks: prev.attacks.filter((_, i) => i !== idx) }));
  };
  const updateAbility = (idx, key, val) => {
    setEditing(prev => {
      const abilities = [...prev.abilities];
      abilities[idx] = { ...abilities[idx], [key]: val };
      return { ...prev, abilities };
    });
  };
  const addAbility = () => {
    if (editing.abilities.length < 3) {
      setEditing(prev => ({ ...prev, abilities: [...prev.abilities, { ...EMPTY_ABILITY }] }));
    }
  };
  const removeAbility = (idx) => {
    setEditing(prev => ({ ...prev, abilities: prev.abilities.filter((_, i) => i !== idx) }));
  };

  const filtered = units.filter(u => {
    if (!search.trim()) return true;
    const s = search.toLowerCase();
    return u.name.toLowerCase().includes(s) || u.pilot.toLowerCase().includes(s) || u.faction.toLowerCase().includes(s);
  });

  return (
    <div className="app">
      <div className="header">
        <div className="header-left">
          <div className="logo-mark"><div className="logo-mark-inner" /></div>
          <div>
            <div className="logo-text">Gundam Assemble</div>
            <div className="logo-sub">UNIT DATA EDITOR</div>
          </div>
        </div>
        <div className="header-actions">
          <input type="file" ref={fileRef} accept=".lua,.txt" style={{ display: "none" }} onChange={handleFileImport} />
          <button className="btn btn-accent2 btn-sm" onClick={() => setShowWikiImport(true)}>PASTE WIKI</button>
          <button className="btn btn-accent2 btn-sm" onClick={() => setShowImport(true)}>PASTE LUA</button>
          <button className="btn btn-sm" onClick={() => fileRef.current?.click()}>LOAD FILE</button>
          <button className="btn btn-sm" onClick={() => { if (units.length === 0 || window.confirm("Replace the current unit list with the GitHub version?")) loadFromGithub(true); }} disabled={loadingGithub}>{loadingGithub ? "LOADING…" : "RELOAD GITHUB"}</button>
          <button className="btn btn-sm" onClick={handleExport} disabled={units.length === 0}>EXPORT LUA</button>
          <button className="btn btn-primary btn-sm" onClick={handleNew}>+ NEW UNIT</button>
        </div>
      </div>

      <div className="main">
        {units.length > 0 && (
          <div className="search-bar">
            <input placeholder="Search units by name, pilot, or faction..." value={search} onChange={(e) => setSearch(e.target.value)} />
          </div>
        )}
        <div className="unit-count">{filtered.length} UNIT{filtered.length !== 1 ? "S" : ""} LOADED</div>
        {filtered.length === 0 && units.length === 0 ? (
          <div className="empty-state">
            <div className="empty-state-icon">⬡</div>
            <p>NO UNITS — ADD ONE OR IMPORT FROM LUA / WIKI</p>
          </div>
        ) : (
          <div className="unit-grid">
            {filtered.map(u => (
              <div className="unit-row" key={u._key} onClick={() => handleEdit(u)}>
                <div>
                  <div className="unit-name">{u.name}</div>
                  <div className="unit-pilot">{u.pilot}</div>
                </div>
                <div className="unit-faction">{u.faction}</div>
                <div className="unit-stat"><span>HP</span>{u.hp}</div>
                <div className="unit-stat"><span>TL</span>{u.timeline}</div>
                <div className="unit-stat"><span>VP</span>{u.vp}</div>
                <div className="unit-actions" onClick={(e) => e.stopPropagation()}>
                  <button className="btn btn-sm" onClick={() => handleDuplicate(u)}>DUP</button>
                  <button className="btn btn-sm btn-danger" onClick={() => handleDelete(u._key)}>DEL</button>
                </div>
              </div>
            ))}
          </div>
        )}
      </div>

      {editing && (
        <div className="editor-backdrop" onClick={() => setEditing(null)}>
          <div className="editor" onClick={(e) => e.stopPropagation()}>
            <div className="editor-header">
              <div className="editor-title">{editing.name || "New Unit"}</div>
              <button className="remove-btn" onClick={() => setEditing(null)}>✕</button>
            </div>
            <div className="editor-body">
             <div className="editor-columns">
             <div className="editor-form">
              <div className="field-row">
                <div className="field-group" style={{ flex: 2 }}>
                  <label>Unit Name</label>
                  <input value={editing.name} onChange={(e) => updateField("name", e.target.value)} placeholder="e.g. Gundam [White Devil]" />
                </div>
                <div className="field-group">
                  <label>Technical Name</label>
                  <input value={editing.technical_name} onChange={(e) => updateField("technical_name", e.target.value)} placeholder="e.g. ASW-G-08" />
                </div>
              </div>
              <div className="field-row">
                <div className="field-group">
                  <label>Pilot</label>
                  <input value={editing.pilot} onChange={(e) => updateField("pilot", e.target.value)} placeholder="e.g. Amuro Ray" />
                </div>
                <div className="field-group">
                  <label>Faction</label>
                  <input value={editing.faction} onChange={(e) => updateField("faction", e.target.value)} placeholder="e.g. Earth Federation" />
                </div>

              <div className="field-group">
                <label>Splash Art URL</label>
                <input value={editing.splash_art} onChange={(e) => updateField("splash_art", e.target.value)} placeholder="e.g. https://example.com/gundam.png" />

                <div className="field-group"><label>VP</label><input value={editing.vp} onChange={(e) => updateField("vp", e.target.value)} /></div>

                {editing.abilities.length < 3 && <button className="btn btn-sm btn-accent2" onClick={addAbility}>+ ADD</button>}
              </div>
              {editing.abilities.map((ab, abi) => (
                <div className="ability-block" key={abi}>
                  <button className="remove-btn" onClick={() => removeAbility(abi)}>✕</button>
                  <div className="field-group">
                    <label>Ability Name</label>
                    <input value={ab.name} onChange={(e) => updateAbility(abi, "name", e.target.value)} placeholder="e.g. Newtype Reflexes" />
                  </div>
                  <div className="field-group">
                    <label>Keywords</label>
                    <input value={ab.keywords} onChange={(e) => updateAbility(abi, "keywords", e.target.value)} placeholder="e.g. [Response][Energy]" />
                  </div>
                  <div className="field-group">
                    <label>Description</label>
                    <textarea value={ab.description} onChange={(e) => updateAbility(abi, "description", e.target.value)} placeholder="e.g. [After Attack Roll] If this unit is attacking, it sets 2 of those dice to [Crit]" />
                  </div>
                </div>
              ))}
             </div>
             <div className="editor-preview">
               <div className="preview-caption">
                 <span>CARD PREVIEW</span>
                 <button onClick={() => setPreviewTeam(t => t === "blue" ? "red" : "blue")}>
                   {previewTeam === "blue" ? "BLUE TEAM ▸ SWITCH" : "RED TEAM ▸ SWITCH"}
                 </button>
               </div>
               <CardPreview unit={editing} team={previewTeam} />
             </div>
             </div>
            </div>
            <div className="editor-footer">
              <button className="btn" onClick={() => setEditing(null)}>CANCEL</button>
              <button className="btn btn-primary" onClick={handleSave}>SAVE UNIT</button>
            </div>
          </div>
        </div>
      )}

      {showLua && (
        <div className="lua-modal-backdrop" onClick={() => setShowLua(false)}>
          <div className="lua-modal" onClick={(e) => e.stopPropagation()}>
            <div className="lua-modal-header">
              <div className="editor-title">LUA OUTPUT</div>
              <button className="remove-btn" onClick={() => setShowLua(false)}>✕</button>
            </div>
            <div className="lua-modal-body">
              <textarea
                ref={luaRef}
                readOnly
                value={toLua(units)}
                onClick={(e) => e.target.select()}
                style={{
                  width: "100%", height: "100%", minHeight: "400px",
                  fontFamily: "var(--font-mono)", fontSize: "12px", lineHeight: "1.6",
                  color: "var(--text)", background: "var(--bg-input)",
                  border: "none", padding: "20px 24px", resize: "none", outline: "none"
                }}
              />
            </div>
            <div className="lua-modal-footer">
              <button className="btn btn-sm" onClick={() => { luaRef.current?.select(); }}>SELECT ALL</button>
              <button className="btn btn-sm btn-primary" onClick={handleDownload}>DOWNLOAD .LUA</button>
            </div>
          </div>
        </div>
      )}

      {showImport && (
        <div className="lua-modal-backdrop" onClick={() => setShowImport(false)}>
          <div className="lua-modal" onClick={(e) => e.stopPropagation()}>
            <div className="lua-modal-header">
              <div className="editor-title">IMPORT LUA</div>
              <button className="remove-btn" onClick={() => setShowImport(false)}>✕</button>
            </div>
            <div className="lua-modal-body" style={{ padding: "20px 24px" }}>
              <textarea
                style={{ width: "100%", minHeight: "300px", fontFamily: "var(--font-mono)", fontSize: "12px" }}
                value={importText}
                onChange={(e) => setImportText(e.target.value)}
                placeholder={'Paste your Lua data here...\n\nreturn {\n   {\n      name="...",\n      ...\n   }\n}'}
              />
            </div>
            <div className="lua-modal-footer">
              <button className="btn btn-sm" onClick={() => setShowImport(false)}>CANCEL</button>
              <button className="btn btn-sm btn-primary" onClick={handleImport}>IMPORT</button>
            </div>
          </div>
        </div>
      )}

      {showWikiImport && (
        <div className="lua-modal-backdrop" onClick={() => setShowWikiImport(false)}>
          <div className="lua-modal" onClick={(e) => e.stopPropagation()}>
            <div className="lua-modal-header">
              <div className="editor-title">IMPORT FROM WIKI</div>
              <button className="remove-btn" onClick={() => setShowWikiImport(false)}>✕</button>
            </div>
            <div className="lua-modal-body" style={{ padding: "20px 24px" }}>
              <textarea
                style={{ width: "100%", minHeight: "300px", fontFamily: "var(--font-mono)", fontSize: "12px" }}
                value={wikiText}
                onChange={(e) => setWikiText(e.target.value)}
                placeholder={'Paste wiki source here...\n\n{{UnitInfo\n|title=Gundam Name\n|Pilot=Pilot Name\n...\n}}\n== Attacks ==\n=== Attack Name ===\n...'}
              />
            </div>
            <div className="lua-modal-footer">
              <button className="btn btn-sm" onClick={() => setShowWikiImport(false)}>CANCEL</button>
              <button className="btn btn-sm btn-primary" onClick={handleWikiImport}>IMPORT</button>
            </div>
          </div>
        </div>
      )}

      {toast && <div className="toast">{toast}</div>}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
