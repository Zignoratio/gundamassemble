const tcLoadImage = (src) => new Promise((res, rej) => { const im = new Image(); im.onload = () => res(im); im.onerror = rej; im.src = src; });
const tcSheetName = (label) => label.replace(/[^A-Za-z0-9]+/g, "_").replace(/^_|_$/g, "") || "Cards";
// Re-encode a card's stored art (data URI) into the chosen format.
async function tcEncodeArt(dataUrl, fmt = "webp") {
  const img = await new Promise((res, rej) => { const im = new Image(); im.onload = () => res(im); im.onerror = rej; im.src = dataUrl; });
  const c = document.createElement("canvas"); c.width = img.naturalWidth; c.height = img.naturalHeight;
  c.getContext("2d").drawImage(img, 0, 0);
  return canvasToBlob(c, fmt);
}
function tcDownload(blob, filename) {
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob); a.download = filename; a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 3000);
}

// --- Output folder (File System Access API: Chrome / Edge). The chosen folder is remembered between sessions. ---
const tcFolderSupported = () => typeof window.showDirectoryPicker === "function";
async function tcFolderUsable(handle) {
  if (!handle) return false;
  try {
    if ((await handle.queryPermission({ mode: "readwrite" })) === "granted") return true;
    return (await handle.requestPermission({ mode: "readwrite" })) === "granted";
  } catch { return false; }
}
async function tcWriteFile(dir, name, blob) {
  const fh = await dir.getFileHandle(name, { create: true });
  const w = await fh.createWritable();
  await w.write(blob); await w.close();
}

// ST01-T03 style IDs: group by ST number, then T number. Other IDs come next (by ID text),
// then cards with no ID, alphabetically by name. Display order only; the library keeps its order.
function tcSortKey(c) {
  const id = (c.cardId || "").trim();
  const m = id.match(/ST\s*0*(\d+)\D*T\s*0*(\d+)/i);
  if (m) return [0, +m[1], +m[2], (c.name || "").toLowerCase()];
  if (id) return [1, 0, 0, id.toLowerCase()];
  return [2, 0, 0, (c.name || "").toLowerCase()];
}
function tcCompare(a, b) {
  const ka = tcSortKey(a), kb = tcSortKey(b);
  for (let i = 0; i < ka.length; i++) {
    if (ka[i] < kb[i]) return -1;
    if (ka[i] > kb[i]) return 1;
  }
  return 0;
}

// Which collapsible group a card belongs to: ST01, ST02 ... then other ID prefixes, then "Missing ID".
function tcGroupOf(c) {
  const id = (c.cardId || "").trim();
  if (!id) return { key: "~missing", label: "Missing ID", order: [2, 0, ""] };
  const m = id.match(/ST\s*0*(\d+)/i);
  if (m) { const k = "ST" + String(+m[1]).padStart(2, "0"); return { key: k, label: k, order: [0, +m[1], ""] }; }
  const p = (id.split(/[-\s]/)[0] || id).toUpperCase();
  return { key: p, label: p, order: [1, 0, p] };
}
function tcGroupCards(sorted) {
  const map = new Map();
  for (const c of sorted) {
    const g = tcGroupOf(c);
    if (!map.has(g.key)) map.set(g.key, { ...g, cards: [] });
    map.get(g.key).cards.push(c);
  }
  return [...map.values()].sort((a, b) => {
    for (let i = 0; i < 3; i++) { if (a.order[i] < b.order[i]) return -1; if (a.order[i] > b.order[i]) return 1; }
    return 0;
  });
}

function TacticsCardEditor({ cards, setCards, showToast, editing, setEditing, folderRef, format, setFormat }) {
  const [search, setSearch] = useState("");
  const [showTypes, setShowTypes] = useState({ attack: true, command: true, response: true });
  const [collapsed, setCollapsed] = useState({});
  // While exporting, every card is shown (ignoring filters and collapsed groups) so it can be rendered.
  const [forceAll, setForceAll] = useState(false);
  useEffect(() => { tcDB.get("ga_tactics_collapsed").then(v => { if (v) setCollapsed(v); }); }, []);
  const setGroupsCollapsed = (next) => { setCollapsed(next); tcDB.set("ga_tactics_collapsed", next); };
  const toggleGroup = (key) => setGroupsCollapsed({ ...collapsed, [key]: !collapsed[key] });
  const [exporting, setExporting] = useState("");
  const [folder, setFolder] = useState(null);
  const artInput = useRef();

  useEffect(() => { tcDB.get("ga_tactics_folder").then(h => { if (h) setFolder(h); }); }, []);
  useEffect(() => { if (folderRef) folderRef.current = folder; }, [folder]);

  // Ask for (or re-verify) the output folder. Returns the handle or null.
  const getFolder = async (forcePick = false) => {
    if (!tcFolderSupported()) return null;
    let h = folder;
    if (forcePick || !h || !(await tcFolderUsable(h))) {
      try { h = await window.showDirectoryPicker({ mode: "readwrite", id: "ga-tactics-out" }); }
      catch { return null; }
      setFolder(h); tcDB.set("ga_tactics_folder", h);
    }
    return h;
  };

  const upd = (k, v) => setEditing(c => ({ ...c, [k]: v }));
  const updAtk = (k, v) => setEditing(c => ({ ...c, attack: { ...c.attack, [k]: v } }));
  const updFx = (i, v) => setEditing(c => { const fx = [...c.attack.effects]; fx[i] = v; return { ...c, attack: { ...c.attack, effects: fx } }; });
  const addFx = () => setEditing(c => ({ ...c, attack: { ...c.attack, effects: [...c.attack.effects, ""] } }));
  const delFx = (i) => setEditing(c => ({ ...c, attack: { ...c.attack, effects: c.attack.effects.filter((_, j) => j !== i) } }));

  const handleArt = async (e) => {
    const f = e.target.files[0]; e.target.value = ""; if (!f) return;
    try { const a = await tcLoadArtFile(f); setEditing(c => ({ ...c, ...a, artX: 0, artY: 0, artZoom: 100 })); }
    catch { showToast("COULD NOT READ IMAGE"); }
  };

  const save = () => {
    if (!editing.name.trim()) { showToast("CARD NAME REQUIRED"); return; }
    setCards(prev => prev.some(c => c._key === editing._key) ? prev.map(c => c._key === editing._key ? editing : c) : [...prev, editing]);
    setEditing(null); showToast("CARD SAVED");
  };

  // Renders one card at full size. Cards hidden by filters or collapsed groups are shown briefly first.
  const renderCardCanvas = async (card, msg) => {
    const find = () => document.querySelector(`[data-tc="${card._key}"] .tcard`);
    let el = find();
    if (!el) { setForceAll(true); await new Promise(r => setTimeout(r, 200)); el = find(); }
    if (!el) throw new Error("card not on screen");
    setExporting(msg || "RENDERING " + (card.name || "CARD").toUpperCase() + "…");
    await new Promise(r => setTimeout(r, 60));
    return tcRenderCanvas(el);
  };
  const renderCard = async (card) => canvasToBlob(await renderCardCanvas(card), format);

  // One sheet image: cards left to right, top to bottom, then the card back.
  const buildSheet = async (page, label) => {
    const canvas = document.createElement("canvas");
    // Always 10 wide; only as many rows as the cards + card back need (unused rows at the bottom are trimmed).
    const rowsUsed = Math.ceil((page.length + 1) / TC_SHEET_COLS);
    canvas.width = TC_SHEET_COLS * TC_SHEET_CW; canvas.height = rowsUsed * TC_SHEET_CH;
    const ctx = canvas.getContext("2d");
    if (format === "jpg") { ctx.fillStyle = "#fff"; ctx.fillRect(0, 0, canvas.width, canvas.height); }
    ctx.imageSmoothingQuality = "high";
    const slot = (i) => [(i % TC_SHEET_COLS) * TC_SHEET_CW, Math.floor(i / TC_SHEET_COLS) * TC_SHEET_CH];
    for (let i = 0; i < page.length; i++) {
      const cc = await renderCardCanvas(page[i], `RENDERING ${label} · ${i + 1}/${page.length}…`);
      const [x, y] = slot(i);
      ctx.drawImage(cc, x, y, TC_SHEET_CW, TC_SHEET_CH);
    }
    const [bx, by] = slot(page.length);
    ctx.drawImage(await tcLoadImage(TC_CARD_BACK_SRC), bx, by, TC_SHEET_CW, TC_SHEET_CH);
    setExporting(`ENCODING ${label} SHEET…`);
    return new Promise(res => canvas.toBlob(res, TC_FORMATS[format].mime, format === "png" ? undefined : TC_SHEET_QUALITY));
  };
  const ext = TC_FORMATS[format].ext;

  // Single card: into the output folder if one is set (Chrome/Edge), otherwise a normal download.
  const exportOne = async (key) => {
    const card = cards.find(c => c._key === key); if (!card) return;
    try {
      const blob = await renderCard(card);
      const dir = folder && (await tcFolderUsable(folder)) ? folder : null;
      if (dir) { const imgDir = await dir.getDirectoryHandle(TC_RENDER_DIR, { create: true }); await tcWriteFile(imgDir, tcFileName(card.name) + "." + ext, blob); showToast(`SAVED TO ${dir.name}/${TC_RENDER_DIR}`.toUpperCase()); }
      else { tcDownload(blob, tcFileName(card.name) + "." + ext); showToast(ext.toUpperCase() + " SAVED"); }
    } catch (e) { console.error(e); showToast("EXPORT FAILED"); }
    setExporting(""); setForceAll(false);
  };

  // Where exported files go: the output folder (Chrome/Edge, asked for up front while the click still counts),
  // otherwise a single download or a zip.
  const makeSink = async (pickNew) => {
    if (tcFolderSupported()) {
      const dir = await getFolder(pickNew); if (!dir) return null;
      let n = 0;
      return {
        put: async (sub, name, blob) => { const d = sub ? await dir.getDirectoryHandle(sub, { create: true }) : dir; await tcWriteFile(d, name, blob); n++; },
        finish: async () => showToast(`${n} FILE(S) SAVED TO ${dir.name.toUpperCase()}`),
      };
    }
    const files = [];
    return {
      put: async (sub, name, blob) => { files.push({ path: sub ? sub + "/" + name : name, name, blob }); },
      finish: async (zipName) => {
        if (files.length === 0) { showToast("NOTHING TO EXPORT"); return; }
        if (files.length === 1) { tcDownload(files[0].blob, files[0].name); showToast("FILE SAVED"); return; }
        const zip = new JSZip(); files.forEach(f => zip.file(f.path, f.blob));
        setExporting("ZIPPING…");
        tcDownload(await zip.generateAsync({ type: "blob" }), zipName); showToast("ZIP SAVED");
      },
    };
  };

  // Export a set of cards (subset) or the whole library: art files, card sheets and/or the JSON.
  const exportCards = async ({ subset = null, art = false, sheets = false, json = false, zipName = "GundamAssembleCardData.zip", pickNew = false }) => {
    if (cards.length === 0) return;
    try {
      const sink = await makeSink(pickNew); if (!sink) return;
      // File names come from the whole library so they always match the JSON.
      const keys = subset ? new Set(subset.map(c => c._key)) : null;
      const chosen = tcAssignFileNames(cards).filter(c => !keys || keys.has(c._key));
      if (art) {
        for (const c of chosen) {
          if (!c.art) continue;
          setExporting("ENCODING ART " + (c.name || "").toUpperCase() + "…");
          await sink.put(TC_ART_DIR, `${c.file}.${ext}`, await tcEncodeArt(c.art, format));
        }
      }
      if (sheets) {
        for (const g of tcGroupCards([...chosen].sort(tcCompare))) {
          const pages = [];
          for (let i = 0; i < g.cards.length; i += TC_SHEET_PER) pages.push(g.cards.slice(i, i + TC_SHEET_PER));
          for (let p = 0; p < pages.length; p++) {
            const label = g.label.toUpperCase() + (pages.length > 1 ? ` (${p + 1}/${pages.length})` : "");
            const blob = await buildSheet(pages[p], label);
            await sink.put(TC_RENDER_DIR, `${tcSheetName(g.label)}${pages.length > 1 ? "_" + (p + 1) : ""}.${ext}`, blob);
          }
        }
      }
      if (json) await sink.put("", TC_JSON_NAME, new Blob([tcLibraryJSON(cards, format)], { type: "application/json" }));
      await sink.finish(zipName);
    } catch (e) { console.error(e); showToast("EXPORT FAILED"); }
    setExporting(""); setForceAll(false);
  };

  const filtered = cards.filter(c => {
    if (forceAll) return true;
    if (!showTypes[c.type]) return false;
    const q = search.toLowerCase();
    return !q || [c.name, c.cardId, c.tag1, c.tag2, c.type].some(v => (v || "").toLowerCase().includes(q));
  }).sort(tcCompare);
  const groups = tcGroupCards(filtered);
  // Full sets (ignoring filters) for the per-set export buttons.
  const allGroups = new Map(tcGroupCards([...cards].sort(tcCompare)).map(g => [g.key, g.cards]));

  return (
    <React.Fragment>
      <div className="main">
        {cards.length > 0 && (
          <div className="tc-type-filter">
            {Object.entries(TC_TYPES).map(([k, label]) => (
              <label key={k} className={`tc-type-opt ${k}` + (showTypes[k] ? " on" : "")}>
                <input type="checkbox" checked={showTypes[k]}
                  onChange={() => setShowTypes(s => ({ ...s, [k]: !s[k] }))} />
                {label} <span>{cards.filter(c => c.type === k).length}</span>
              </label>
            ))}
          </div>
        )}
        {cards.length > 0 && (
          <div className="tc-export-bar top">
            <div className="tc-export-row">
              <label className="tc-format">FORMAT
                <select value={format} onChange={(e) => setFormat(e.target.value)}>
                  <option value="webp">WebP</option><option value="png">PNG</option><option value="jpg">JPG</option>
                </select>
              </label>
              <button className="btn btn-sm btn-primary" onClick={() => exportCards({ art: true, sheets: true, json: true })}>EXPORT EVERYTHING</button>
              {tcFolderSupported() && <button className="btn btn-sm" onClick={() => exportCards({ art: true, sheets: true, json: true, pickNew: true })}>CHOOSE FOLDER…</button>}
            </div>
            <div className="tc-hint">
              {tcFolderSupported()
                ? (folder ? `OUTPUT FOLDER: ${folder.name}` : "No output folder yet — the first export asks for one")
                : "This browser can't write to folders, so exports arrive as a zip"}
              {` · EVERYTHING = ${TC_JSON_NAME} + ${TC_ART_DIR}/ + a card sheet per set in ${TC_RENDER_DIR}/ · Each set below has its own ART and CARD IMAGES export · Sheets are 10 cards wide (7500 px) and up to 7 rows tall (7350 px max), 750×1050 per card, with the card back after the last card`}
            </div>
          </div>
        )}
        {cards.length > 0 && (
          <div className="search-bar">
            <input placeholder="Search cards by name, ID, tag, or type..." value={search} onChange={(e) => setSearch(e.target.value)} />
          </div>
        )}
        <div className="tc-count-row">
          <div className="unit-count">{filtered.length} CARD{filtered.length !== 1 ? "S" : ""} IN LIBRARY</div>
          {groups.length > 1 && (
            <div className="tc-count-actions">
              <button className="btn btn-sm" onClick={() => setGroupsCollapsed({})}>EXPAND ALL</button>
              <button className="btn btn-sm" onClick={() => setGroupsCollapsed(Object.fromEntries(groups.map(g => [g.key, true])))}>COLLAPSE ALL</button>
            </div>
          )}
        </div>
        {cards.length === 0 ? (
          <div className="empty-state"><div className="empty-state-icon">⬡</div><p>NO CARDS — ADD ONE OR LOAD A JSON LIBRARY</p></div>
        ) : (
          groups.map(g => {
            const isClosed = !forceAll && !!collapsed[g.key];
            return (
            <div className={"tc-group" + (isClosed ? " collapsed" : "") + (g.key === "~missing" ? " missing" : "")} key={g.key}>
              <div className="tc-group-head">
                <button className="tc-group-toggle" onClick={() => toggleGroup(g.key)} aria-expanded={!isClosed}>
                  <span className="tc-group-caret">▾</span>
                  <span>{g.label}</span>
                  <span className="tc-group-count">{g.cards.length} CARD{g.cards.length !== 1 ? "S" : ""}</span>
                </button>
                <div className="tc-group-actions">
                  <button className="btn btn-sm btn-accent2" onClick={() => exportCards({ subset: allGroups.get(g.key), art: true, zipName: `${tcSheetName(g.label)}_${TC_ART_DIR}.zip` })}>EXPORT ART</button>
                  <button className="btn btn-sm" onClick={() => exportCards({ subset: allGroups.get(g.key), sheets: true, zipName: `${tcSheetName(g.label)}_${TC_RENDER_DIR}.zip` })}>EXPORT CARD IMAGES</button>
                </div>
              </div>
              {!isClosed && (
          <div className="tc-grid">
            {g.cards.map(c => (
              <div className="tc-item" key={c._key} data-tc={c._key}>
                <TacticsCard card={c} />
                <div className="tc-item-controls">
                  <button className="btn btn-sm btn-primary" onClick={() => exportOne(c._key)}>{ext.toUpperCase()}</button>
                  <button className="btn btn-sm" onClick={() => setEditing(JSON.parse(JSON.stringify(c)))}>EDIT</button>
                  <button className="btn btn-sm" onClick={() => setCards(p => [...p, { ...JSON.parse(JSON.stringify(c)), _key: generateId(), name: c.name + " (copy)" }])}>DUP</button>
                  <button className="btn btn-sm btn-danger" onClick={() => { if (window.confirm(`Delete "${c.name}"?`)) setCards(p => p.filter(x => x._key !== c._key)); }}>DEL</button>
                </div>
              </div>
            ))}
          </div>
              )}
            </div>
            );
          })
        )}
      </div>

      {editing && (
        <div className="editor-backdrop" onClick={() => setEditing(null)}>
          <div className="editor" onClick={(e) => e.stopPropagation()}>
            <div className="editor-header">
              <div className="editor-title">{editing.name || "New Tactics Card"}</div>
              <button className="remove-btn" onClick={() => setEditing(null)}>✕</button>
            </div>
            <div className="editor-body">
              <div className="editor-columns">
                <div className="editor-form">
                  <div className="field-row">
                    <div className="field-group"><label>Card Type</label>
                      <select value={editing.type} onChange={(e) => upd("type", e.target.value)}>
                        {Object.entries(TC_TYPES).map(([k, v]) => <option key={k} value={k}>{v}</option>)}
                      </select>
                    </div>
                    <div className="field-group" style={{ flex: 2 }}><label>Card Name</label>
                      <input value={editing.name} onChange={(e) => upd("name", e.target.value)} placeholder="e.g. Epic Shot" />
                    </div>
                  </div>
                  <div className="field-row">
                    <div className="field-group"><label>Tag 1</label><input value={editing.tag1} onChange={(e) => upd("tag1", e.target.value)} placeholder="e.g. Legendary Hero" /></div>
                    <div className="field-group"><label>Tag 2</label><input value={editing.tag2} onChange={(e) => upd("tag2", e.target.value)} placeholder="e.g. Earth Federation" /></div>
                  </div>
                  <div className="field-row">
                    <div className="field-group"><label>Card ID</label><input value={editing.cardId} onChange={(e) => upd("cardId", e.target.value)} placeholder="e.g. ST01-T01" /></div>
                    <div className="field-group"><label>Rarity</label><input value={editing.rarity} onChange={(e) => upd("rarity", e.target.value)} placeholder="e.g. C, U, R, S" maxLength={2} /></div>
                    <div className="field-group"><label>Text Box</label>
                      <select value={editing.boxStyle} onChange={(e) => upd("boxStyle", e.target.value)} disabled={editing.type === "attack"}>
                        <option value="auto">Auto</option><option value="dark">Dark</option><option value="color">Type color</option>
                      </select>
                    </div>
                  </div>

                  {editing.type === "attack" ? (
                    <div className="attack-block">
                      <div className="field-group"><label>Weapon Name</label>
                        <input value={editing.attack.name} onChange={(e) => updAtk("name", e.target.value)} placeholder="e.g. Beam Rifle" />
                      </div>
                      <div className="field-row" style={{ marginTop: 14 }}>
                        <div className="field-group"><label>Cost</label><input value={editing.attack.cost} onChange={(e) => updAtk("cost", e.target.value)} placeholder="3" /></div>
                        <div className="field-group"><label>Range</label><input value={editing.attack.range} onChange={(e) => updAtk("range", e.target.value)} placeholder="5 or SP" /></div>
                        <div className="field-group"><label>Strength</label><input value={editing.attack.strength} onChange={(e) => updAtk("strength", e.target.value)} placeholder="7" /></div>
                        {isSP(editing.attack.range) && (
                          <div className="field-group sp-group"><label>SP Shape</label>
                            <div className="sp-picker">
                              {Object.keys(SP_IMAGES).map(k => (
                                <button type="button" key={k} className={"sp-opt" + (editing.attack.sp_shape === k ? " active" : "")} onClick={() => updAtk("sp_shape", k)} title={k}>
                                  <img src={SP_IMAGES[k]} alt={k} />{k}
                                </button>
                              ))}
                            </div>
                          </div>
                        )}
                      </div>
                      <div className="field-group" style={{ marginTop: 14 }}><label>Effects</label>
                        {editing.attack.effects.map((ef, i) => (
                          <div className="effect-row" key={i}>
                            <input value={ef} onChange={(e) => updFx(i, e.target.value)} placeholder="e.g. [Strength +2] for each other allied unit within [Range 3]." />
                            {editing.attack.effects.length > 1 && <button className="effect-remove" onClick={() => delFx(i)}>✕</button>}
                          </div>
                        ))}
                        <button className="effect-add" onClick={addFx}>+ add effect line</button>
                      </div>
                    </div>
                  ) : (
                    <div className="field-group"><label>Effect Text</label>
                      <textarea value={editing.effect} onChange={(e) => upd("effect", e.target.value)} style={{ minHeight: 90 }}
                        placeholder="e.g. [After Attack Roll] An allied Earth Federation defender is dealt [Damage -2] this attack and gains 1 [Shield] Upgrade." />
                    </div>
                  )}

                  <div className="field-row">
                    <div className="field-group" style={{ flex: 2 }}><label>Scenario (optional)</label>
                      <input value={editing.scenario} onChange={(e) => upd("scenario", e.target.value)} placeholder="e.g. Scenario : Operation Star One" />
                    </div>
                    <div className="field-group"><label>Footer Text</label>
                      <input value={editing.footer} onChange={(e) => upd("footer", e.target.value)} />
                    </div>
                  </div>

                  <div className="field-group"><label>Card Art</label>
                    <input type="file" accept="image/*" ref={artInput} style={{ display: "none" }} onChange={handleArt} />
                    <div className="tc-art-drop" onClick={() => artInput.current?.click()}>
                      {editing.art ? `IMAGE LOADED (${editing.artW}×${editing.artH}) — CLICK TO REPLACE` : "CLICK TO UPLOAD IMAGE"}
                    </div>
                    {editing.art && (
                      <div className="field-row" style={{ alignItems: "flex-end", marginTop: 6 }}>
                        <div className="field-group" style={{ flex: 3 }}><label>Zoom {editing.artZoom}%</label>
                          <input type="range" className="tc-slider" min="100" max="300" value={editing.artZoom} onChange={(e) => upd("artZoom", parseInt(e.target.value))} />
                        </div>
                        <button className="btn btn-sm" onClick={() => setEditing(c => ({ ...c, artX: 0, artY: 0, artZoom: 100 }))}>RESET</button>
                        <button className="btn btn-sm btn-danger" onClick={() => setEditing(c => ({ ...c, art: null, artW: 0, artH: 0 }))}>REMOVE</button>
                      </div>
                    )}
                  </div>
                </div>

                <div className="editor-preview" style={{ width: 300 }}>
                  <div className="preview-caption"><span>CARD PREVIEW</span></div>
                  <div className="tc-preview-wrap">
                    <TacticsCard card={editing} interactive onArtDrag={(x, y) => setEditing(c => ({ ...c, artX: x, artY: y }))} />
                    <div className="tc-hint">{editing.art ? "DRAG THE ART TO POSITION IT" : "KEYWORDS IN [BRACKETS] BECOME BADGES"}</div>
                  </div>
                </div>
              </div>
            </div>
            <div className="editor-footer">
              <button className="btn" onClick={() => setEditing(null)}>CANCEL</button>
              <button className="btn btn-primary" onClick={save}>SAVE CARD</button>
            </div>
          </div>
        </div>
      )}

      {exporting && <div className="tc-export-overlay">{exporting}</div>}
    </React.Fragment>
  );
}

const GITHUB_UNITS_URL = "https://raw.githubusercontent.com/Zignoratio/gundamassemble/main/GundamAssembleUnits.lua";
// Tactics card library on GitHub. The JSON sits next to the units lua; each card's art is a separate file
// in the CardArt/ subfolder, named after the card (e.g. CardArt/epic_shot.jpg), referenced by filename in the JSON.
const GITHUB_REPO_BASE = "https://raw.githubusercontent.com/Zignoratio/gundamassemble/main/";
const GITHUB_CARDS_URL = GITHUB_REPO_BASE + TC_JSON_NAME;
const GITHUB_CARD_ART_URL = GITHUB_REPO_BASE + TC_ART_DIR + "/";

function App() {
  const [units, setUnits] = useState([]);
  const [editing, setEditing] = useState(null);
  const [showLua, setShowLua] = useState(false);
  const [showImport, setShowImport] = useState(false);
  const [showWikiImport, setShowWikiImport] = useState(false);
  const [importText, setImportText] = useState("");
  const [wikiText, setWikiText] = useState("");
  const [toast, setToast] = useState("");
  const [search, setSearch] = useState("");
  const [loadingGithub, setLoadingGithub] = useState(false);
  const [mode, setMode] = useState("units");
  const [tcards, setTcards] = useState([]);
  const [tcEditing, setTcEditing] = useState(null);
  const [tcLoaded, setTcLoaded] = useState(false);
  const fileRef = useRef();
  const tcFileRef = useRef();
  const luaRef = useRef();

  const showToast = (msg) => { setToast(msg); setTimeout(() => setToast(""), 2500); };

  // Load the current unit list from GitHub. replace=true swaps the list out
  // (used on startup and by the RELOAD button); false appends.
  const loadFromGithub = async (replace = true) => {
    setLoadingGithub(true);
    try {
      const res = await fetch(GITHUB_UNITS_URL + "?t=" + Date.now(), { cache: "no-store" });
      if (!res.ok) throw new Error("HTTP " + res.status);
      const text = await res.text();
      const parsed = parseLua(text);
      if (parsed && parsed.length > 0) {
        setUnits(prev => replace ? parsed : [...prev, ...parsed]);
        showToast(`${parsed.length} UNIT(S) LOADED FROM GITHUB`);
      } else {
        showToast("GITHUB LOAD FAILED — CHECK LUA FORMAT");
      }
    } catch (e) {
      showToast("GITHUB LOAD FAILED — " + e.message);
    } finally {
      setLoadingGithub(false);
    }
  };

  useEffect(() => { loadFromGithub(true); }, []);

  // Tactics card library: auto-saved in the browser (IndexedDB), plus JSON save/load for backups.
  const [loadingCards, setLoadingCards] = useState(false);
  const loadCardsFromGithub = async () => {
    setLoadingCards(true);
    try {
      const res = await fetch(GITHUB_CARDS_URL + "?t=" + Date.now(), { cache: "no-store" });
      if (!res.ok) throw new Error("HTTP " + res.status);
      const d = await res.json();
      if (!Array.isArray(d.cards)) throw new Error("bad format");
      const hydrated = await Promise.all(d.cards.map(c => tcHydrateCard(c, tcGithubArtLoader)));
      setTcards(hydrated);
      const missing = hydrated.filter((c, i) => d.cards[i].artFile && !c.art).length;
      showToast(`${d.cards.length} CARD(S) LOADED FROM GITHUB` + (missing ? ` — ${missing} ART FILE(S) MISSING` : ""));
      return true;
    } catch (e) {
      showToast("GITHUB CARD LOAD FAILED — " + e.message);
      return false;
    } finally { setLoadingCards(false); }
  };

  // Startup: use the locally auto-saved library if there is one (it may hold unsaved edits); otherwise pull GitHub.
  useEffect(() => {
    tcDB.get(TC_STORAGE_KEY).then(async v => {
      if (Array.isArray(v) && v.length > 0) setTcards(v);
      else await loadCardsFromGithub();
      setTcLoaded(true);
    });
  }, []);
  useEffect(() => { if (tcLoaded) tcDB.set(TC_STORAGE_KEY, tcards); }, [tcards, tcLoaded]);

  const tcNew = () => setTcEditing({ ...JSON.parse(JSON.stringify(EMPTY_TCARD)), _key: generateId() });
  const [showCardJson, setShowCardJson] = useState(false);
  const [tcFormat, setTcFormat] = useState("webp");
  useEffect(() => { tcDB.get("ga_tactics_format").then(f => { if (f && TC_FORMATS[f]) setTcFormat(f); }); }, []);
  const changeFormat = (f) => { setTcFormat(f); tcDB.set("ga_tactics_format", f); };
  const cardJsonRef = useRef();
  const tcCopyJSON = async () => {
    const text = tcLibraryJSON(tcards, tcFormat);
    try { await navigator.clipboard.writeText(text); showToast("JSON COPIED TO CLIPBOARD"); }
    catch { cardJsonRef.current?.select(); document.execCommand("copy"); showToast("JSON COPIED TO CLIPBOARD"); }
  };
  const tcDownloadJSON = () => tcDownload(new Blob([tcLibraryJSON(tcards, tcFormat)], { type: "application/json" }), TC_JSON_NAME);
  // Load a JSON file from disk. Art is looked up in the output folder's CardArt/ (if one is set) and then on GitHub.
  const tcLoadJSON = (e) => {
    const f = e.target.files[0]; e.target.value = ""; if (!f) return;
    const r = new FileReader();
    r.onload = async (ev) => {
      try {
        const d = JSON.parse(ev.target.result);
        if (!Array.isArray(d.cards)) throw new Error();
        const dir = tcFolderRef.current;
        const folderLoader = dir && (await tcFolderUsable(dir)) ? tcFolderArtLoader(dir) : null;
        const loader = async (file) => (folderLoader && await folderLoader(file)) || tcGithubArtLoader(file).catch(() => null);
        const incoming = await Promise.all(d.cards.map(c => tcHydrateCard(c, loader)));
        const replace = tcards.length === 0 || window.confirm("Replace the current card library? (Cancel = append)");
        setTcards(prev => replace ? incoming : [...prev, ...incoming]);
        showToast(`${incoming.length} CARD(S) LOADED`);
      } catch { showToast("COULD NOT READ JSON"); }
    };
    r.readAsText(f);
  };
  const tcFolderRef = useRef(null);

  const handleNew = () => {
    setEditing({ ...EMPTY_UNIT, _key: generateId(), attacks: [{ ...EMPTY_ATTACK, effects: [""] }], abilities: [] });
  };
  const handleEdit = (u) => { setEditing(JSON.parse(JSON.stringify(u))); };
  const handleDelete = (id) => { setUnits(prev => prev.filter(u => u._key !== id)); showToast("UNIT DELETED"); };
  const handleSave = () => {
    if (!editing.name.trim()) return;
    setUnits(prev => {
      const idx = prev.findIndex(u => u._key === editing._key);
      if (idx >= 0) { const next = [...prev]; next[idx] = editing; return next; }
      return [...prev, editing];
    });
    setEditing(null);
    showToast("UNIT SAVED");
  };
  const handleDuplicate = (u) => {
    const dup = JSON.parse(JSON.stringify(u));
    dup._key = generateId();
    dup.name = u.name + " (Copy)";
    setUnits(prev => [...prev, dup]);
    showToast("UNIT DUPLICATED");
  };
  const handleExport = () => setShowLua(true);
  const handleDownload = () => {
    try {
      const data = toLua(units);
      const dataUri = "data:text/plain;charset=utf-8," + encodeURIComponent(data);
      const a = document.createElement("a");
      a.href = dataUri;
      a.download = "units.lua";
      a.style.display = "none";
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      showToast("FILE DOWNLOADED");
    } catch (e) {
      showToast("DOWNLOAD FAILED — USE SELECT ALL + COPY");
    }
  };
  const handleImport = () => {
    const parsed = parseLua(importText);
    if (parsed && parsed.length > 0) {
      setUnits(prev => [...prev, ...parsed]);
      setShowImport(false);
      setImportText("");
      showToast(`${parsed.length} UNIT(S) IMPORTED`);
    } else {
      showToast("IMPORT FAILED — CHECK LUA FORMAT");
    }
  };
  const handleFileImport = (e) => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (ev) => {
      const parsed = parseLua(ev.target.result);
      if (parsed && parsed.length > 0) {
        setUnits(prev => [...prev, ...parsed]);
        showToast(`${parsed.length} UNIT(S) IMPORTED FROM FILE`);
      } else {
        showToast("IMPORT FAILED — CHECK LUA FORMAT");
      }
    };
    reader.readAsText(file);
    e.target.value = "";
  };
  const handleWikiImport = () => {
    const parsed = parseWiki(wikiText);
    if (parsed) {
      setUnits(prev => [...prev, parsed]);
      setShowWikiImport(false);
      setWikiText("");
      showToast("UNIT IMPORTED FROM WIKI");
    } else {
      showToast("IMPORT FAILED — CHECK WIKI FORMAT");
    }
  };

  const updateField = (key, val) => setEditing(prev => ({ ...prev, [key]: val }));
  const updateAttack = (idx, key, val) => {
    setEditing(prev => {
      const attacks = [...prev.attacks];
      attacks[idx] = { ...attacks[idx], [key]: val };
      return { ...prev, attacks };
    });
  };
  const updateEffect = (aidx, eidx, val) => {
    setEditing(prev => {
      const attacks = [...prev.attacks];
      const effects = [...attacks[aidx].effects];
      effects[eidx] = val;
      attacks[aidx] = { ...attacks[aidx], effects };
      return { ...prev, attacks };
    });
  };
  const addEffect = (aidx) => {
    setEditing(prev => {
      const attacks = [...prev.attacks];
      attacks[aidx] = { ...attacks[aidx], effects: [...attacks[aidx].effects, ""] };
      return { ...prev, attacks };
    });
  };
  const removeEffect = (aidx, eidx) => {
    setEditing(prev => {
      const attacks = [...prev.attacks];
      const effects = attacks[aidx].effects.filter((_, i) => i !== eidx);
      if (effects.length === 0) effects.push("");
      attacks[aidx] = { ...attacks[aidx], effects };
      return { ...prev, attacks };
    });
  };
  const addAttack = () => {
    if (editing.attacks.length < 2) {
      setEditing(prev => ({ ...prev, attacks: [...prev.attacks, { ...EMPTY_ATTACK, effects: [""] }] }));
    }
  };
  const removeAttack = (idx) => {
    setEditing(prev => ({ ...prev, attacks: prev.attacks.filter((_, i) => i !== idx) }));
  };
  const updateAbility = (idx, key, val) => {
    setEditing(prev => {
      const abilities = [...prev.abilities];
      abilities[idx] = { ...abilities[idx], [key]: val };
      return { ...prev, abilities };
    });
  };
  const addAbility = () => {
    if (editing.abilities.length < 3) {
      setEditing(prev => ({ ...prev, abilities: [...prev.abilities, { ...EMPTY_ABILITY }] }));
    }
  };
  const removeAbility = (idx) => {
    setEditing(prev => ({ ...prev, abilities: prev.abilities.filter((_, i) => i !== idx) }));
  };

  const filtered = units.filter(u => {
    if (!search.trim()) return true;
    const s = search.toLowerCase();
    return u.name.toLowerCase().includes(s) || u.pilot.toLowerCase().includes(s) || u.faction.toLowerCase().includes(s);
  });

  return (
    <div className="app">
      <div className="header">
        <div className="header-left">
          <div className="logo-mark"><div className="logo-mark-inner" /></div>
          <div>
            <div className="logo-text">Gundam Assemble</div>
            <div className="logo-sub">{mode === "units" ? "UNIT DATA EDITOR" : "TACTICS CARD EDITOR"}</div>
          </div>
        </div>
        <div className="header-actions">
          <button className="btn btn-sm mode-toggle" onClick={() => { setMode(m => m === "units" ? "cards" : "units"); setEditing(null); setTcEditing(null); }}>
            {mode === "units" ? "TACTICS CARD EDITOR ▸" : "◂ UNIT DATA EDITOR"}
          </button>
          {mode === "cards" ? (
            <React.Fragment>
              <input type="file" ref={tcFileRef} accept=".json" style={{ display: "none" }} onChange={tcLoadJSON} />
              <button className="btn btn-sm" onClick={() => tcFileRef.current?.click()}>LOAD JSON</button>
              <button className="btn btn-sm" onClick={() => setShowCardJson(true)} disabled={tcards.length === 0}>SHOW JSON</button>
              <button className="btn btn-sm" onClick={tcDownloadJSON} disabled={tcards.length === 0}>DOWNLOAD JSON</button>
              <button className="btn btn-sm" disabled={loadingCards} onClick={() => { if (tcards.length === 0 || window.confirm("Replace the current card library with the GitHub version? Any local edits not yet exported will be lost.")) loadCardsFromGithub(); }}>{loadingCards ? "LOADING…" : "RELOAD GITHUB"}</button>
              <button className="btn btn-primary btn-sm" onClick={tcNew}>+ NEW CARD</button>
            </React.Fragment>
          ) : (
          <React.Fragment>
          <input type="file" ref={fileRef} accept=".lua,.txt" style={{ display: "none" }} onChange={handleFileImport} />
          <button className="btn btn-accent2 btn-sm" onClick={() => setShowWikiImport(true)}>PASTE WIKI</button>
          <button className="btn btn-accent2 btn-sm" onClick={() => setShowImport(true)}>PASTE LUA</button>
          <button className="btn btn-sm" onClick={() => fileRef.current?.click()}>LOAD FILE</button>
          <button className="btn btn-sm" onClick={() => { if (units.length === 0 || window.confirm("Replace the current unit list with the GitHub version?")) loadFromGithub(true); }} disabled={loadingGithub}>{loadingGithub ? "LOADING…" : "RELOAD GITHUB"}</button>
          <button className="btn btn-sm" onClick={handleExport} disabled={units.length === 0}>EXPORT LUA</button>
          <button className="btn btn-primary btn-sm" onClick={handleNew}>+ NEW UNIT</button>
          </React.Fragment>
          )}
        </div>
      </div>

      {mode === "cards" && <TacticsCardEditor cards={tcards} setCards={setTcards} showToast={showToast} editing={tcEditing} setEditing={setTcEditing} folderRef={tcFolderRef} format={tcFormat} setFormat={changeFormat} />}

      {mode === "units" && <React.Fragment>
      <div className="main">
        {units.length > 0 && (
          <div className="search-bar">
            <input placeholder="Search units by name, pilot, or faction..." value={search} onChange={(e) => setSearch(e.target.value)} />
          </div>
        )}
        <div className="unit-count">{filtered.length} UNIT{filtered.length !== 1 ? "S" : ""} LOADED</div>
        {filtered.length === 0 && units.length === 0 ? (
          <div className="empty-state">
            <div className="empty-state-icon">⬡</div>
            <p>NO UNITS — ADD ONE OR IMPORT FROM LUA / WIKI</p>
          </div>
        ) : (
          <div className="unit-grid">
            {filtered.map(u => (
              <div className="unit-row" key={u._key} onClick={() => handleEdit(u)}>
                <div>
                  <div className="unit-name">{u.name}</div>
                  <div className="unit-pilot">{u.pilot}</div>
                </div>
                <div className="unit-faction">{u.faction}</div>
                <div className="unit-stat"><span>HP</span>{u.hp}</div>
                <div className="unit-stat"><span>TL</span>{u.timeline}</div>
                <div className="unit-stat"><span>VP</span>{u.vp}</div>
                <div className="unit-actions" onClick={(e) => e.stopPropagation()}>
                  <button className="btn btn-sm" onClick={() => handleDuplicate(u)}>DUP</button>
                  <button className="btn btn-sm btn-danger" onClick={() => handleDelete(u._key)}>DEL</button>
                </div>
              </div>
            ))}
          </div>
        )}
      </div>

      {editing && (
        <div className="editor-backdrop" onClick={() => setEditing(null)}>
          <div className="editor" onClick={(e) => e.stopPropagation()}>
            <div className="editor-header">
              <div className="editor-title">{editing.name || "New Unit"}</div>
              <button className="remove-btn" onClick={() => setEditing(null)}>✕</button>
            </div>
            <div className="editor-body">
             <div className="editor-columns">
             <div className="editor-form">
              <div className="field-row">
                <div className="field-group" style={{ flex: 2 }}>
                  <label>Unit Name</label>
                  <input value={editing.name} onChange={(e) => updateField("name", e.target.value)} placeholder="e.g. Gundam [White Devil]" />
                </div>
                <div className="field-group">
                  <label>Technical Name</label>
                  <input value={editing.technical_name} onChange={(e) => updateField("technical_name", e.target.value)} placeholder="e.g. ASW-G-08" />
                </div>
              </div>
              <div className="field-row">
                <div className="field-group">
                  <label>Pilot</label>
                  <input value={editing.pilot} onChange={(e) => updateField("pilot", e.target.value)} placeholder="e.g. Amuro Ray" />
                </div>
                <div className="field-group">
                  <label>Faction</label>
                  <input value={editing.faction} onChange={(e) => updateField("faction", e.target.value)} placeholder="e.g. Earth Federation" />
                </div>
              </div>
              <div className="field-group">
                <label>Splash Art URL</label>
                <input value={editing.splash_art} onChange={(e) => updateField("splash_art", e.target.value)} placeholder="e.g. https://example.com/gundam.png" />
              </div>
              <div className="field-row">
                <div className="field-group"><label>HP</label><input value={editing.hp} onChange={(e) => updateField("hp", e.target.value)} /></div>
                <div className="field-group"><label>Timeline</label><input value={editing.timeline} onChange={(e) => updateField("timeline", e.target.value)} /></div>
                <div className="field-group"><label>VP</label><input value={editing.vp} onChange={(e) => updateField("vp", e.target.value)} /></div>
              </div>

              <div className="section-label">
                Attacks ({editing.attacks.length}/2)
                {editing.attacks.length < 2 && <button className="btn btn-sm" onClick={addAttack}>+ ADD</button>}
              </div>
              {editing.attacks.map((atk, ai) => (
                <div className="attack-block" key={ai}>
                  {editing.attacks.length > 1 && <button className="remove-btn" onClick={() => removeAttack(ai)}>✕</button>}
                  <div className="field-group">
                    <label>Attack Name</label>
                    <input value={atk.name} onChange={(e) => updateAttack(ai, "name", e.target.value)} placeholder="e.g. Beam Rifle" />
                  </div>
                  <div className="field-row">
                    <div className="field-group"><label>Cost</label><input value={atk.cost} onChange={(e) => updateAttack(ai, "cost", e.target.value)} placeholder="e.g. 2TL" /></div>
                    <div className="field-group"><label>Range</label><input value={atk.range} onChange={(e) => updateAttack(ai, "range", e.target.value)} /></div>
                    <div className="field-group"><label>Strength</label><input value={atk.strength} onChange={(e) => updateAttack(ai, "strength", e.target.value)} /></div>
                    {isSP(atk.range) && (
                      <div className="field-group sp-group"><label>SP Shape</label>
                        <div className="sp-picker">
                          {Object.keys(SP_IMAGES).map(k => (
                            <button type="button" key={k} className={"sp-opt" + (atk.sp_shape === k ? " active" : "")}
                              onClick={() => updateAttack(ai, "sp_shape", k)} title={k}>
                              <img src={SP_IMAGES[k]} alt={k} />{k}
                            </button>
                          ))}
                        </div>
                      </div>
                    )}
                  </div>
                  <div className="field-group">
                    <label>Effects</label>
                    {atk.effects.map((ef, ei) => (
                      <div className="effect-row" key={ei}>
                        <input value={ef} onChange={(e) => updateEffect(ai, ei, e.target.value)} placeholder="e.g. [Critical] [After Combat Damage] Fracture the target" />
                        {atk.effects.length > 1 && <button className="effect-remove" onClick={() => removeEffect(ai, ei)}>✕</button>}
                      </div>
                    ))}
                    <button className="effect-add" onClick={() => addEffect(ai)}>+ add effect line</button>
                  </div>
                </div>
              ))}

              <div className="section-label">
                Abilities ({editing.abilities.length}/3)
                {editing.abilities.length < 3 && <button className="btn btn-sm btn-accent2" onClick={addAbility}>+ ADD</button>}
              </div>
              {editing.abilities.map((ab, abi) => (
                <div className="ability-block" key={abi}>
                  <button className="remove-btn" onClick={() => removeAbility(abi)}>✕</button>
                  <div className="field-group">
                    <label>Ability Name</label>
                    <input value={ab.name} onChange={(e) => updateAbility(abi, "name", e.target.value)} placeholder="e.g. Newtype Reflexes" />
                  </div>
                  <div className="field-group">
                    <label>Keywords</label>
                    <input value={ab.keywords} onChange={(e) => updateAbility(abi, "keywords", e.target.value)} placeholder="e.g. [Response][Energy]" />
                  </div>
                  <div className="field-group">
                    <label>Description</label>
                    <textarea value={ab.description} onChange={(e) => updateAbility(abi, "description", e.target.value)} placeholder="e.g. [After Attack Roll] If this unit is attacking, it sets 2 of those dice to [Crit]" />
                  </div>
                </div>
              ))}
             </div>
             <div className="editor-preview">
               <div className="preview-caption"><span>CARD PREVIEW</span></div>
               <CardPreview unit={editing} />
             </div>
             </div>
            </div>
            <div className="editor-footer">
              <button className="btn" onClick={() => setEditing(null)}>CANCEL</button>
              <button className="btn btn-primary" onClick={handleSave}>SAVE UNIT</button>
            </div>
          </div>
        </div>
      )}

      </React.Fragment>}

      {showCardJson && (
        <div className="lua-modal-backdrop" onClick={() => setShowCardJson(false)}>
          <div className="lua-modal" onClick={(e) => e.stopPropagation()}>
            <div className="lua-modal-header">
              <div className="editor-title">CARD DATA JSON</div>
              <button className="remove-btn" onClick={() => setShowCardJson(false)}>✕</button>
            </div>
            <div className="lua-modal-body">
              <textarea
                ref={cardJsonRef}
                readOnly
                value={tcLibraryJSON(tcards, tcFormat)}
                onClick={(e) => e.target.select()}
                style={{
                  width: "100%", height: "100%", minHeight: "400px",
                  fontFamily: "var(--font-mono)", fontSize: "12px", lineHeight: "1.6",
                  color: "var(--text)", background: "var(--bg-input)",
                  border: "none", padding: "20px 24px", resize: "none", outline: "none"
                }}
              />
            </div>
            <div className="lua-modal-footer">
              <span className="tc-hint" style={{ marginRight: "auto", textAlign: "left" }}>Paste into {TC_JSON_NAME} on GitHub · art files go in {TC_ART_DIR}/</span>
              <button className="btn btn-sm" style={{ whiteSpace: "nowrap" }} onClick={() => { cardJsonRef.current?.select(); }}>SELECT ALL</button>
              <button className="btn btn-sm btn-accent2" style={{ whiteSpace: "nowrap" }} onClick={tcCopyJSON}>COPY TO CLIPBOARD</button>
              <button className="btn btn-sm btn-primary" style={{ whiteSpace: "nowrap" }} onClick={tcDownloadJSON}>DOWNLOAD .JSON</button>
            </div>
          </div>
        </div>
      )}

      {showLua && (
        <div className="lua-modal-backdrop" onClick={() => setShowLua(false)}>
          <div className="lua-modal" onClick={(e) => e.stopPropagation()}>
            <div className="lua-modal-header">
              <div className="editor-title">LUA OUTPUT</div>
              <button className="remove-btn" onClick={() => setShowLua(false)}>✕</button>
            </div>
            <div className="lua-modal-body">
              <textarea
                ref={luaRef}
                readOnly
                value={toLua(units)}
                onClick={(e) => e.target.select()}
                style={{
                  width: "100%", height: "100%", minHeight: "400px",
                  fontFamily: "var(--font-mono)", fontSize: "12px", lineHeight: "1.6",
                  color: "var(--text)", background: "var(--bg-input)",
                  border: "none", padding: "20px 24px", resize: "none", outline: "none"
                }}
              />
            </div>
            <div className="lua-modal-footer">
              <button className="btn btn-sm" onClick={() => { luaRef.current?.select(); }}>SELECT ALL</button>
              <button className="btn btn-sm btn-primary" onClick={handleDownload}>DOWNLOAD .LUA</button>
            </div>
          </div>
        </div>
      )}

      {showImport && (
        <div className="lua-modal-backdrop" onClick={() => setShowImport(false)}>
          <div className="lua-modal" onClick={(e) => e.stopPropagation()}>
            <div className="lua-modal-header">
              <div className="editor-title">IMPORT LUA</div>
              <button className="remove-btn" onClick={() => setShowImport(false)}>✕</button>
            </div>
            <div className="lua-modal-body" style={{ padding: "20px 24px" }}>
              <textarea
                style={{ width: "100%", minHeight: "300px", fontFamily: "var(--font-mono)", fontSize: "12px" }}
                value={importText}
                onChange={(e) => setImportText(e.target.value)}
                placeholder={'Paste your Lua data here...\n\nreturn {\n   {\n      name="...",\n      ...\n   }\n}'}
              />
            </div>
            <div className="lua-modal-footer">
              <button className="btn btn-sm" onClick={() => setShowImport(false)}>CANCEL</button>
              <button className="btn btn-sm btn-primary" onClick={handleImport}>IMPORT</button>
            </div>
          </div>
        </div>
      )}

      {showWikiImport && (
        <div className="lua-modal-backdrop" onClick={() => setShowWikiImport(false)}>
          <div className="lua-modal" onClick={(e) => e.stopPropagation()}>
            <div className="lua-modal-header">
              <div className="editor-title">IMPORT FROM WIKI</div>
              <button className="remove-btn" onClick={() => setShowWikiImport(false)}>✕</button>
            </div>
            <div className="lua-modal-body" style={{ padding: "20px 24px" }}>
              <textarea
                style={{ width: "100%", minHeight: "300px", fontFamily: "var(--font-mono)", fontSize: "12px" }}
                value={wikiText}
                onChange={(e) => setWikiText(e.target.value)}
                placeholder={'Paste wiki source here...\n\n{{UnitInfo\n|title=Gundam Name\n|Pilot=Pilot Name\n...\n}}\n== Attacks ==\n=== Attack Name ===\n...'}
              />
            </div>
            <div className="lua-modal-footer">
              <button className="btn btn-sm" onClick={() => setShowWikiImport(false)}>CANCEL</button>
              <button className="btn btn-sm btn-primary" onClick={handleWikiImport}>IMPORT</button>
            </div>
          </div>
        </div>
      )}

      {toast && <div className="toast">{toast}</div>}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
