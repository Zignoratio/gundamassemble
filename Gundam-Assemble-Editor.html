<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gundam Assemble — Unit Data &amp; Tactics Card Editor</title>
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;500;600;700&family=Share+Tech+Mono&family=Exo+2:wght@300;400;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.26.9/babel.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<style>
:root {
  --bg-deep: #0a0c10;
  --bg-panel: #111520;
  --bg-card: #161b28;
  --bg-input: #0d1018;
  --border: #1e2940;
  --border-focus: #e63946;
  --accent: #e63946;
  --accent-glow: rgba(230, 57, 70, 0.3);
  --accent2: #00b4d8;
  --accent2-glow: rgba(0, 180, 216, 0.2);
  --text: #e8eaf0;
  --text-dim: #6b7394;
  --text-label: #8e95b4;
  --success: #06d6a0;
  --warning: #ffd166;
  --font-display: 'Rajdhani', sans-serif;
  --font-mono: 'Share Tech Mono', monospace;
  --font-body: 'Exo 2', sans-serif;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body, #root { height: 100%; }
body { background: var(--bg-deep); }

.app {
  font-family: var(--font-body);
  color: var(--text);
  min-height: 100vh;
  background: var(--bg-deep);
  background-image:
    radial-gradient(ellipse at 20% 0%, rgba(230,57,70,0.06) 0%, transparent 60%),
    radial-gradient(ellipse at 80% 100%, rgba(0,180,216,0.04) 0%, transparent 60%);
}

.header {
  padding: 20px 32px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  border-bottom: 1px solid var(--border);
  background: linear-gradient(180deg, rgba(22,27,40,0.95) 0%, var(--bg-deep) 100%);
}
.header-left { display: flex; align-items: center; gap: 16px; }
.logo-mark {
  width: 40px; height: 40px;
  background: var(--accent);
  clip-path: polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%);
  display: flex; align-items: center; justify-content: center;
}
.logo-mark-inner {
  width: 24px; height: 24px;
  background: var(--bg-deep);
  clip-path: polygon(50% 10%, 90% 30%, 90% 70%, 50% 90%, 10% 70%, 10% 30%);
}
.logo-text {
  font-family: var(--font-display);
  font-weight: 700;
  font-size: 24px;
  letter-spacing: 3px;
  text-transform: uppercase;
  color: var(--text);
}
.logo-sub {
  font-family: var(--font-mono);
  font-size: 10px;
  color: var(--text-dim);
  letter-spacing: 2px;
  margin-top: -2px;
}
.header-actions { display: flex; gap: 10px; flex-wrap: wrap; }

.btn {
  font-family: var(--font-display);
  font-weight: 600;
  font-size: 13px;
  letter-spacing: 1.5px;
  text-transform: uppercase;
  padding: 10px 20px;
  border: 1px solid var(--border);
  background: var(--bg-card);
  color: var(--text);
  cursor: pointer;
  transition: all 0.15s;
  clip-path: polygon(0 0, calc(100% - 8px) 0, 100% 8px, 100% 100%, 8px 100%, 0 calc(100% - 8px));
}
.btn:hover { border-color: var(--accent); background: rgba(230,57,70,0.08); }
.btn-primary { background: var(--accent); border-color: var(--accent); color: #fff; }
.btn-primary:hover { background: #c1303e; }
.btn-sm { padding: 6px 14px; font-size: 11px; clip-path: none; }
.btn-danger { border-color: #e63946; color: #e63946; }
.btn-danger:hover { background: rgba(230,57,70,0.15); }
.btn-accent2 { border-color: var(--accent2); color: var(--accent2); }
.btn-accent2:hover { background: var(--accent2-glow); }

.main { padding: 24px 32px; max-width: 1200px; margin: 0 auto; }

.unit-count {
  font-family: var(--font-mono);
  font-size: 12px;
  color: var(--text-dim);
  margin-bottom: 16px;
  padding-left: 4px;
}
.unit-grid { display: flex; flex-direction: column; gap: 8px; }
.unit-row {
  display: grid;
  grid-template-columns: 1fr 160px 80px 60px 60px auto;
  align-items: center;
  gap: 12px;
  padding: 14px 20px;
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-left: 3px solid var(--accent);
  cursor: pointer;
  transition: all 0.15s;
}
.unit-row:hover { border-color: var(--accent); background: rgba(230,57,70,0.04); }
.unit-name {
  font-family: var(--font-display);
  font-weight: 700;
  font-size: 16px;
  letter-spacing: 0.5px;
}
.unit-pilot { font-size: 12px; color: var(--text-dim); }
.unit-faction {
  font-family: var(--font-mono);
  font-size: 11px;
  color: var(--accent2);
  letter-spacing: 0.5px;
}
.unit-stat {
  font-family: var(--font-mono);
  font-size: 13px;
  text-align: center;
}
.unit-stat span { font-size: 9px; color: var(--text-dim); display: block; margin-bottom: 2px; text-transform: uppercase; letter-spacing: 1px; }
.unit-actions { display: flex; gap: 6px; }

.editor-backdrop {
  position: fixed; inset: 0; background: rgba(0,0,0,0.7);
  z-index: 100; display: flex; align-items: flex-start; justify-content: center;
  padding: 40px 20px; overflow-y: auto;
}
.editor {
  background: var(--bg-panel);
  border: 1px solid var(--border);
  width: 100%; max-width: 720px;
  clip-path: polygon(0 0, calc(100% - 16px) 0, 100% 16px, 100% 100%, 16px 100%, 0 calc(100% - 16px));
  padding: 0;
}
.editor-header {
  padding: 20px 28px;
  border-bottom: 1px solid var(--border);
  display: flex; justify-content: space-between; align-items: center;
}
.editor-title {
  font-family: var(--font-display);
  font-weight: 700;
  font-size: 20px;
  letter-spacing: 2px;
  text-transform: uppercase;
}
.editor-body { padding: 24px 28px; display: flex; flex-direction: column; gap: 20px; }
.editor-footer {
  padding: 16px 28px;
  border-top: 1px solid var(--border);
  display: flex; justify-content: flex-end; gap: 10px;
}

.field-group { display: flex; flex-direction: column; gap: 6px; }
.field-row { display: flex; gap: 12px; }
.field-row > .field-group { flex: 1; }

/* SP shape picker — inline in the attack row, after Strength */
.field-row > .field-group.sp-group { flex: 0 0 auto; margin-left: 24px; }
.sp-picker {
  display: flex; gap: 8px; padding: 4px 8px;
  background: var(--bg-card); border: 1px solid var(--accent); border-radius: 6px;
}
.sp-opt {
  display: flex; flex-direction: column; align-items: center; gap: 4px;
  padding: 4px; border: 2px solid transparent; border-radius: 4px;
  background: none; cursor: pointer; color: var(--text-dim);
  font-family: var(--font-mono); font-size: 10px; letter-spacing: 1px;
}
.sp-opt img { width: 44px; height: 44px; object-fit: contain; background: #fff; border-radius: 3px; }
.sp-opt:hover { border-color: var(--text-dim); }
.sp-opt.active { border-color: var(--accent); color: var(--accent); }

label {
  font-family: var(--font-display);
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 2px;
  text-transform: uppercase;
  color: var(--text-label);
}

input, textarea {
  font-family: var(--font-body);
  font-size: 14px;
  padding: 10px 14px;
  background: var(--bg-input);
  border: 1px solid var(--border);
  color: var(--text);
  outline: none;
  transition: border-color 0.15s;
}
input:focus, textarea:focus { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent-glow); }
textarea { resize: vertical; min-height: 50px; font-size: 13px; }

.section-label {
  font-family: var(--font-display);
  font-weight: 700;
  font-size: 14px;
  letter-spacing: 2px;
  text-transform: uppercase;
  color: var(--accent);
  padding-bottom: 6px;
  border-bottom: 1px solid var(--border);
  display: flex; justify-content: space-between; align-items: center;
}

.attack-block, .ability-block {
  background: var(--bg-card);
  border: 1px solid var(--border);
  padding: 16px;
  display: flex; flex-direction: column; gap: 10px;
  position: relative;
}
.attack-block { border-left: 3px solid var(--accent); }
.ability-block { border-left: 3px solid var(--accent2); }

.remove-btn {
  position: absolute; top: 8px; right: 8px;
  background: none; border: none; color: var(--text-dim);
  cursor: pointer; font-size: 18px; line-height: 1;
}
.remove-btn:hover { color: var(--accent); }

.effect-row { display: flex; gap: 8px; align-items: center; }
.effect-row input { flex: 1; }
.effect-add {
  font-family: var(--font-mono);
  font-size: 11px;
  color: var(--accent);
  cursor: pointer;
  background: none; border: none;
  padding: 4px 0;
}
.effect-add:hover { text-decoration: underline; }
.effect-remove {
  background: none; border: none; color: var(--text-dim);
  cursor: pointer; font-size: 16px;
}
.effect-remove:hover { color: var(--accent); }

.lua-modal-backdrop {
  position: fixed; inset: 0; background: rgba(0,0,0,0.8);
  z-index: 200; display: flex; align-items: center; justify-content: center;
  padding: 40px 20px;
}
.lua-modal {
  background: var(--bg-panel);
  border: 1px solid var(--border);
  width: 100%; max-width: 800px; max-height: 80vh;
  display: flex; flex-direction: column;
}
.lua-modal-header {
  padding: 16px 24px;
  border-bottom: 1px solid var(--border);
  display: flex; justify-content: space-between; align-items: center;
}
.lua-modal-body { padding: 0; flex: 1; overflow: auto; }
.lua-modal-footer {
  padding: 12px 24px;
  border-top: 1px solid var(--border);
  display: flex; justify-content: flex-end; gap: 10px;
}

.toast {
  position: fixed; bottom: 24px; right: 24px;
  background: var(--success);
  color: #000;
  font-family: var(--font-display);
  font-weight: 600;
  font-size: 13px;
  letter-spacing: 1px;
  padding: 12px 20px;
  z-index: 999;
  animation: slideIn 0.3s;
}
@keyframes slideIn { from { transform: translateY(20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }

.empty-state {
  text-align: center;
  padding: 80px 20px;
  color: var(--text-dim);
}
.empty-state-icon { font-size: 48px; margin-bottom: 16px; opacity: 0.3; }
.empty-state p {
  font-family: var(--font-mono);
  font-size: 13px;
  letter-spacing: 1px;
}

.search-bar { margin-bottom: 16px; }
.search-bar input {
  width: 100%;
  font-family: var(--font-mono);
  font-size: 13px;
  padding: 12px 16px;
  background: var(--bg-card);
  border: 1px solid var(--border);
  color: var(--text);
}
.search-bar input::placeholder { color: var(--text-dim); }

/* ---------- Card preview ---------- */
.editor { max-width: 1320px; }
.editor-columns { display: flex; gap: 28px; align-items: flex-start; }
.editor-form { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 20px; }
.editor-preview { width: 520px; flex-shrink: 0; position: sticky; top: 0; }
.preview-caption {
  font-family: var(--font-mono); font-size: 11px; color: var(--text-dim);
  letter-spacing: 1px; margin-bottom: 10px; display: flex; justify-content: space-between;
}

.card-art {
  position: absolute; left: 44%; right: 0; top: 0; height: 22.5%;
  background-size: cover; background-position: center;
}
.card-art::before {
  content: ""; position: absolute; inset: 0;
  background: linear-gradient(90deg, #000 0%, rgba(0,0,0,0) 45%);
}
.card-side { position: absolute; left: 1.2%; width: 4.6%; border-radius: 3px; }
.card-side.up   { top: 1.3%;  height: 7.5%; background: #2e8b3d; }
.card-side.down { top: 9.6%;  height: 7.5%; background: #b71c1c; }
.card-side.pin  { top: 17.5%; height: 7.5%; background: #1e6fe0; }

.card-stats {
  position: absolute; left: 6.5%; top: 1.6%; color: #fff; font-weight: 700; font-size: 17px;
  display: flex; gap: 16px; letter-spacing: 0.3px;
}
.card-tech { position: absolute; left: 6.5%; top: 11.5%; color: #fff; font-weight: 700; font-size: 12px; }
.card-name { position: absolute; left: 6.5%; top: 15.4%; right: 52%; color: #fff; font-weight: 700; font-size: 19px; line-height: 1; white-space: nowrap; }
.card-pilot { position: absolute; left: 6.5%; top: 23.6%; font-weight: 700; font-size: 11px; color: #111; }

.card-atk { position: absolute; top: 28.5%; height: 36%; width: 44%; overflow: hidden; display: flex; flex-direction: column; }
.card-atk.a1 { left: 3.5%; }
.card-atk.a2 { left: 52.5%; }
.card-atk-name { font-weight: 700; font-size: 20px; line-height: 1; margin-bottom: 8px; white-space: nowrap; }
.card-pips { display: flex; gap: 9px; margin-bottom: 14px; }
.card-pip {
  flex: 1; background: #000; color: #fff; font-weight: 700; font-size: 17px;
  height: 24px; display: flex; align-items: center; gap: 6px; padding: 0 8px; border-radius: 2px;
}
.card-pip svg { width: 14px; height: 14px; fill: #fff; flex-shrink: 0; }
.card-atk-body { display: flex; gap: 8px; align-items: flex-start; flex: 1; min-height: 0; }
.card-atk-body.sp .card-atk-fx { flex: 1; min-width: 0; }
.card-atk-sp { flex-shrink: 0; align-self: stretch; display: flex; align-items: flex-start; justify-content: center; max-width: 52px; }
.card-atk-sp img { height: 100%; max-height: 100%; width: auto; max-width: 52px; object-fit: contain; display: block; }
.card-atk-sp-empty {
  width: 52px; height: 52px; border: 1px dashed #999; border-radius: 4px;
  display: flex; align-items: center; justify-content: center;
  font-size: 9px; font-weight: 700; color: #777; text-align: center;
}
.card-atk-fx { display: flex; flex-direction: column; gap: 6px; font-size: 9.5px; font-weight: 600; line-height: 1.2; }

.card-ab { position: absolute; top: 69%; bottom: 3.5%; width: 30.5%; padding: 3px 6px 0 7px; overflow: hidden; }
.card-ab.b1 { left: 3.3%; }
.card-ab.b2 { left: 35.6%; }
.card-ab.b3 { left: 67.9%; }
.card-ab-name { font-weight: 700; font-size: 12px; line-height: 1.1; margin-bottom: 10px; }
.card-ab-kw { font-weight: 600; font-size: 9.5px; margin-bottom: 6px; }
.card-ab-desc { font-weight: 600; font-size: 9.5px; line-height: 1.2; white-space: pre-line; }

.card-placeholder { opacity: 0.35; }

@media (max-width: 1100px) {
  .editor-columns { flex-direction: column; }
  .editor-preview { position: static; width: 100%; }
  .card { margin: 0 auto; }
}

@media (max-width: 700px) {
  .header { flex-direction: column; gap: 12px; padding: 16px; }
  .main { padding: 16px; }
  .unit-row { grid-template-columns: 1fr; gap: 6px; }
  .field-row { flex-direction: column; }
  .field-row > .field-group.sp-group { margin-left: 0; }
  .editor-body { padding: 16px; }
}
/* ======================================================================
   TACTICS CARD EDITOR
   Card face is 300x420 on screen (2.5" x 3.5"); exported at 5x = 1500x2100 (600 DPI)
   ====================================================================== */
.mode-toggle { border-color: var(--accent2); color: var(--accent2); }
.mode-toggle:hover { background: var(--accent2-glow); }

.tc-grid { display: flex; flex-wrap: wrap; gap: 24px; align-items: flex-start; }
.tc-item { display: flex; flex-direction: column; align-items: center; gap: 8px; }
.tc-item-controls { display: flex; gap: 6px; }

.tcard {
  position: relative; width: 300px; height: 420px; flex-shrink: 0;
  background: #d9d6cf; border-radius: 12px; overflow: hidden;
  font-family: var(--font-body); color: #111;
  box-shadow: 0 14px 32px rgba(0,0,0,0.55);
  --tc-color: #3b3b40;
}
.tcard.attack   { --tc-color: #d3262c; }
.tcard.command  { --tc-color: #1d43b6; }
.tcard.response { --tc-color: #dd6a2a; }
.tcard-inner { position: absolute; inset: 6px; border-radius: 8px; overflow: hidden; background: #e9e6df; }

/* art */
.tcard-art { position: absolute; left: 0; right: 0; top: 0; height: 252px; overflow: hidden; background: #1b1e26; }
.tcard-art.drag { cursor: grab; }
.tcard-art.drag:active { cursor: grabbing; }
.tcard-art img { position: absolute; max-width: none; max-height: none; user-select: none; pointer-events: none; display: block; }
.tcard-art-empty {
  position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
  color: rgba(255,255,255,0.25); font-family: var(--font-mono); font-size: 11px; letter-spacing: 2px;
  background: linear-gradient(160deg, #1b1e26, #2a2f3d);
}

/* type banner */
.tcard-banner {
  position: absolute; left: 0; top: 0; width: 22px; height: 100px; background: var(--tc-color);
  display: flex; flex-direction: column; align-items: center; padding-top: 8px; gap: 5px;
}
.tcard-banner::after {
  content: ""; position: absolute; left: 0; top: 100%; width: 0; height: 0;
  border-left: 22px solid var(--tc-color); border-bottom: 13px solid transparent;
}
.tcard-banner img { flex-shrink: 0; }
/* rotated with a transform (html2canvas can't do writing-mode) */
.tcard-banner span {
  position: absolute; left: 22px; top: 27px; width: 72px; height: 22px; line-height: 22px;
  transform-origin: 0 0; transform: rotate(90deg);
  color: #fff; font-family: var(--font-display); font-weight: 700; font-size: 11px;
  letter-spacing: 1.5px; text-transform: uppercase; white-space: nowrap;
}

/* effect box */
.tcard-box {
  position: absolute; left: 0; right: 0; top: 252px; height: 100px;
  background: var(--tc-color); color: #fff; padding: 8px 9px 6px;
  background-image: repeating-linear-gradient(-45deg, rgba(255,255,255,0.05) 0, rgba(255,255,255,0.05) 2px, transparent 2px, transparent 8px);
}
.tcard-box.dark { background-color: #3b3b40; }
.tcard-box-text { font-size: 11px; font-weight: 600; line-height: 1.35; white-space: pre-line; overflow: hidden; padding-bottom: 4px; }
.tcard-scenario { position: absolute; left: 9px; right: 9px; top: 79px; font-size: 10.5px; line-height: 1; font-weight: 600; }
.tcard-box.attack { background-color: #d3262c; }
.tcard-atk-head { display: flex; align-items: center; gap: 6px; margin-bottom: 4px; }
.tcard-atk-name {
  background: #fff; color: #111; font-weight: 700; font-size: 13px; line-height: 1;
  padding: 3px 7px; border-radius: 3px; max-width: 150px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.tcard-atk-stat { display: flex; align-items: center; gap: 2px; font-family: var(--font-display); font-weight: 700; font-size: 19px; line-height: 1; }

.tcard-atk-body { display: flex; gap: 6px; }
.tcard-atk-fx { flex: 1; min-width: 0; font-size: 10px; font-weight: 600; line-height: 1.35; overflow: hidden; padding-bottom: 4px; }
.tcard-atk-fx > div + div { margin-top: 2px; }
.tcard-atk-sp { width: 46px; height: 46px; flex-shrink: 0; background: rgba(255,255,255,0.92); border-radius: 4px; display: flex; align-items: center; justify-content: center; overflow: hidden; }
.tcard-atk-sp img { width: 100%; height: 100%; object-fit: contain; }
.tcard-atk-sp span { font-size: 9px; color: #555; font-family: var(--font-mono); }

/* keyword pills */
/* The badge box is a ::before layer so it can be nudged during export without moving the text
   (html2canvas draws inline-block backgrounds slightly high relative to their text). */
.kw {
  position: relative; display: inline-block; padding: 0 4px; margin: 0 1px;
  color: #fff; font-weight: 700; font-size: 0.92em; line-height: 1.3; white-space: nowrap;
}
.kw::before {
  content: ""; position: absolute; left: 0; right: 0; top: 0; bottom: 0; box-sizing: border-box;
  background: var(--kw); border: 1px solid rgba(255,255,255,0.4); border-radius: 2px;
}
.kw > span { position: relative; }
/* Export-only: html2canvas draws the badge box high relative to its text. Shift the whole badge down
   and the text back up by the same amount, so only the box moves. 1px here = 5px in the output image. */
.tcard.exporting .kw { top: 2px; }
.tcard.exporting .kw > span { top: -2px; }

/* bottom strip */
.tcard-bottom {
  position: absolute; left: 0; right: 0; top: 352px; height: 56px; background: #e9e6df;
}
.tcard-tags { position: absolute; left: 8px; top: 6px; display: flex; gap: 0; }
.tcard-tag {
  background: #111; color: #fff; font-size: 9px; font-weight: 700; line-height: 1;
  padding: 3px 4px 3px 7px; white-space: nowrap; position: relative; height: 15px;
}
.tcard-tag::after {
  content: ""; position: absolute; left: 100%; top: 0; width: 0; height: 0;
  border-left: 7px solid #111; border-bottom: 15px solid transparent;
}
.tcard-tag + .tcard-tag { margin-left: 10px; }
.tcard-id {
  position: absolute; right: 0; top: 0; height: 17px; padding: 0 8px 0 6px;
  background: var(--tc-color); color: #fff; font-family: var(--font-mono); font-size: 8px; letter-spacing: 0.5px;
  display: flex; align-items: center; gap: 5px;
}
.tcard-id::before {
  content: ""; position: absolute; right: 100%; top: 0; width: 0; height: 0;
  border-right: 10px solid var(--tc-color); border-top: 17px solid transparent;
}
.tcard-box.dark ~ .tcard-bottom .tcard-id::before { border-right-color: #3b3b40; }
.tcard-box.dark ~ .tcard-bottom .tcard-id { background: #3b3b40; }
.tcard-rarity {
  width: 11px; height: 11px; border-radius: 50%; background: #fff; color: #111;
  font-size: 7px; font-weight: 700; display: inline-flex; align-items: center; justify-content: center; font-family: var(--font-display);
}
.tcard-name {
  position: absolute; left: 8px; right: 44px; top: 21px;
  font-family: var(--font-display); font-weight: 700; font-size: 24px; line-height: 24px; height: 24px; color: #111;
  white-space: nowrap; overflow: hidden; letter-spacing: -0.3px;
}
.tcard-emblem { position: absolute; right: 7px; top: 24px; width: 36px; height: 26px; }
.tcard-emblem img { width: 100%; height: 100%; object-fit: contain; display: block; }
.tcard-foot { position: absolute; left: 8px; top: 45px; font-size: 6px; line-height: 1; color: #666; letter-spacing: 0.3px; }

/* editor bits */
.tc-preview-wrap { display: flex; flex-direction: column; gap: 10px; align-items: center; }
.tc-art-drop {
  border: 1px dashed var(--border); padding: 12px; text-align: center; cursor: pointer;
  font-family: var(--font-mono); font-size: 11px; color: var(--text-dim); letter-spacing: 1px;
}
.tc-art-drop:hover { border-color: var(--accent2); color: var(--accent2); }
.tc-hint { font-family: var(--font-mono); font-size: 10px; color: var(--text-dim); letter-spacing: 1px; text-align: center; }
input[type=range].tc-slider { width: 100%; accent-color: var(--accent2); }
.tc-export-bar { display: flex; flex-direction: column; gap: 10px; margin-top: 28px; padding-top: 18px; border-top: 1px solid var(--border); }
.tc-export-bar.top { margin: 0 0 22px; padding: 0 0 18px; border-top: none; border-bottom: 1px solid var(--border); }
.tc-export-row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.tc-export-bar .tc-hint { text-align: left; line-height: 1.6; }
.tc-format { display: flex; align-items: center; gap: 8px; font-family: var(--font-mono); font-size: 11px; color: var(--text-dim); letter-spacing: 1px; }
.tc-format select { width: auto; padding: 6px 10px; }
.tc-export-overlay {
  position: fixed; inset: 0; background: rgba(0,0,0,0.7); z-index: 500;
  display: flex; align-items: center; justify-content: center;
  font-family: var(--font-mono); color: var(--text); letter-spacing: 2px; font-size: 13px;
}

/* card type filter */
.tc-type-filter { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 18px; }
.tc-type-opt {
  display: flex; align-items: center; gap: 8px; padding: 8px 14px; cursor: pointer;
  background: var(--bg-card); border: 1px solid var(--border); border-left: 3px solid var(--tc);
  font-size: 12px; color: var(--text-dim); letter-spacing: 1.5px; user-select: none;
}
.tc-type-opt.on { color: var(--text); }
.tc-type-opt input { accent-color: var(--tc); }
.tc-type-opt span { font-family: var(--font-mono); font-size: 11px; color: var(--text-dim); }
.tc-type-opt.attack   { --tc: #d3262c; }
.tc-type-opt.command  { --tc: #1d43b6; }
.tc-type-opt.response { --tc: #dd6a2a; }
/* collapsible card groups */
.tc-count-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 16px; }
.tc-count-row .unit-count { margin-bottom: 0; }
.tc-count-actions { display: flex; gap: 6px; }
.tc-group { margin-bottom: 28px; }
.tc-group.collapsed { margin-bottom: 8px; }
.tc-group-head {
  display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
  border-bottom: 1px solid var(--border); padding: 6px 2px; margin-bottom: 18px;
}
.tc-group.collapsed .tc-group-head { margin-bottom: 0; }
.tc-group-toggle {
  display: flex; align-items: baseline; gap: 12px; flex: 1; min-width: 0; text-align: left; cursor: pointer;
  background: none; border: none; padding: 2px 0;
  color: var(--text); font-family: var(--font-display); font-weight: 700; font-size: 20px; letter-spacing: 2px;
}
.tc-group-toggle:hover { color: var(--accent2); }
.tc-group-toggle:focus-visible { outline: 2px solid var(--accent2); outline-offset: 2px; }
.tc-group-actions { display: flex; gap: 6px; }
.tc-group-caret { display: inline-block; width: 14px; font-size: 14px; color: var(--text-dim); transition: transform 0.15s; }
.tc-group.collapsed .tc-group-caret { transform: rotate(-90deg); }
.tc-group-count { font-family: var(--font-mono); font-size: 11px; font-weight: 400; color: var(--text-dim); letter-spacing: 1px; }
.tc-group.missing .tc-group-toggle { color: var(--warning); }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useRef, useEffect } = React;

const EMPTY_ATTACK = { name: "", cost: "", range: "", strength: "", sp_shape: "", effects: [""] };
const EMPTY_ABILITY = { name: "", keywords: "", description: "" };
const EMPTY_UNIT = {
  name: "", pilot: "", faction: "", splash_art: "", technical_name: "",
  hp: "", timeline: "", vp: "",
  attacks: [{ ...EMPTY_ATTACK, effects: [""] }],
  abilities: [],
};

function generateId() {
  return Math.random().toString(16).slice(2, 10);
}

function escapeStr(s) {
  return s.replace(/\\/g, "\\\\").replace(/"/g, '\\"');
}

function toLua(units) {
  const indent = (n) => "   ".repeat(n);
  let lines = ["return {"];
  units.forEach((u, ui) => {
    lines.push(`${indent(1)}{`);
    lines.push(`${indent(2)}name="${escapeStr(u.name)}",`);
    lines.push(`${indent(2)}pilot="${escapeStr(u.pilot)}",`);
    lines.push(`${indent(2)}faction="${escapeStr(u.faction)}",`);
    lines.push(`${indent(2)}technical_name="${escapeStr(u.technical_name)}",`);
    lines.push(`${indent(2)}splash_art="${escapeStr(u.splash_art)}",`);
    lines.push(`${indent(2)}hp="${u.hp}",`);
    lines.push(`${indent(2)}timeline="${u.timeline}",`);
    lines.push(`${indent(2)}vp="${u.vp}",`);
    lines.push(`${indent(2)}attacks={`);
    u.attacks.forEach((a) => {
      lines.push(`${indent(3)}{`);
      lines.push(`${indent(4)}name="${escapeStr(a.name)}",`);
      lines.push(`${indent(4)}cost="${escapeStr(a.cost)}",`);
      lines.push(`${indent(4)}range="${a.range}",`);
      lines.push(`${indent(4)}strength="${a.strength}",`);
      if (isSP(a.range) && a.sp_shape) lines.push(`${indent(4)}sp_shape="${a.sp_shape}",`);
      lines.push(`${indent(4)}effects={`);
      a.effects.forEach((e) => {
        if (e.trim()) lines.push(`${indent(5)}"${escapeStr(e.trim())}",`);
      });
      lines.push(`${indent(4)}}`);
      lines.push(`${indent(3)}},`);
    });
    lines.push(`${indent(2)}},`);
    lines.push(`${indent(2)}abilities={`);
    u.abilities.forEach((ab) => {
      lines.push(`${indent(3)}{`);
      lines.push(`${indent(4)}name="${escapeStr(ab.name)}",`);
      lines.push(`${indent(4)}keywords="${escapeStr(ab.keywords)}",`);
      lines.push(`${indent(4)}description="${escapeStr(ab.description)}"`);
      lines.push(`${indent(3)}},`);
    });
    lines.push(`${indent(2)}}`);
    lines.push(`${indent(1)}}${ui < units.length - 1 ? "," : ""}`);
  });
  lines.push("}");
  return lines.join("\n");
}

function parseLua(text) {
  try {
    const units = [];
    const inner = text.replace(/^return\s*\{/, "").replace(/\}\s*$/, "");
    let depth = 0; let start = -1; const blocks = [];
    for (let i = 0; i < inner.length; i++) {
      if (inner[i] === "{") { if (depth === 0) start = i; depth++; }
      if (inner[i] === "}") { depth--; if (depth === 0 && start >= 0) { blocks.push(inner.slice(start, i + 1)); start = -1; } }
    }
    for (const block of blocks) {
      const getStr = (key) => { const m = block.match(new RegExp(`${key}\\s*=\\s*"([^"]*)"`, "m")); return m ? m[1] : ""; };
      const unit = {
        _key: generateId(),
        name: getStr("name"),
        pilot: getStr("pilot"),
        faction: getStr("faction"),
        technical_name: getStr("technical_name"),
        splash_art: getStr("splash_art"),
        hp: getStr("hp"),
        timeline: getStr("timeline"),
        vp: getStr("vp"),
        attacks: [],
        abilities: [],
      };
      const attacksMatch = block.match(/attacks\s*=\s*\{([\s\S]*?)\}\s*,?\s*abilities/);
      if (attacksMatch) {
        let ad = 0; let as2 = -1; const aBlocks = [];
        const aStr = attacksMatch[1];
        for (let i = 0; i < aStr.length; i++) {
          if (aStr[i] === "{") { if (ad === 0) as2 = i; ad++; }
          if (aStr[i] === "}") { ad--; if (ad === 0 && as2 >= 0) { aBlocks.push(aStr.slice(as2, i + 1)); as2 = -1; } }
        }
        for (const ab of aBlocks) {
          const aGetStr = (key) => { const m = ab.match(new RegExp(`${key}\\s*=\\s*"([^"]*)"`, "m")); return m ? m[1] : ""; };
          const efMatch = ab.match(/effects\s*=\s*\{([\s\S]*?)\}/);
          const effects = [];
          if (efMatch) {
            const efStr = efMatch[1];
            const efItems = efStr.match(/"([^"]*)"/g);
            if (efItems) efItems.forEach(e => effects.push(e.replace(/"/g, "")));
          }
          if (effects.length === 0) effects.push("");
          unit.attacks.push({ name: aGetStr("name"), cost: aGetStr("cost"), range: aGetStr("range"), strength: aGetStr("strength"), sp_shape: aGetStr("sp_shape"), effects });
        }
      }
      if (unit.attacks.length === 0) unit.attacks.push({ ...EMPTY_ATTACK, effects: [""] });
      const abilitiesMatch = block.match(/abilities\s*=\s*\{([\s\S]*)\}\s*$/);
      if (abilitiesMatch) {
        let ad2 = 0; let as3 = -1; const abBlocks = [];
        const abStr = abilitiesMatch[1];
        for (let i = 0; i < abStr.length; i++) {
          if (abStr[i] === "{") { if (ad2 === 0) as3 = i; ad2++; }
          if (abStr[i] === "}") { ad2--; if (ad2 === 0 && as3 >= 0) { abBlocks.push(abStr.slice(as3, i + 1)); as3 = -1; } }
        }
        for (const abb of abBlocks) {
          const abGetStr = (key) => { const m = abb.match(new RegExp(`${key}\\s*=\\s*"([^"]*)"`, "m")); return m ? m[1] : ""; };
          unit.abilities.push({ name: abGetStr("name"), keywords: abGetStr("keywords"), description: abGetStr("description") });
        }
      }
      units.push(unit);
    }
    return units;
  } catch (e) {
    return null;
  }
}

function parseWiki(text) {
  try {
    // Parse the UnitInfo template
    const infoMatch = text.match(/\{\{UnitInfo([\s\S]*?)\}\}/);
    if (!infoMatch) return null;
    const infoBlock = infoMatch[1];
    const getField = (key) => {
      const m = infoBlock.match(new RegExp(`\\|${key}\\s*=\\s*(.*)`, "im"));
      return m ? m[1].trim() : "";
    };

    const unit = {
      _key: generateId(),
      name: getField("title"),
      pilot: getField("Pilot"),
      faction: getField("Faction"),
      technical_name: getField("caption"),
      splash_art: getField("image"),
      hp: getField("HP"),
      timeline: getField("Timeline"),
      vp: getField("VP"),
      attacks: [],
      abilities: [],
    };

    // Parse attacks section
    const attacksSection = text.match(/==\s*Attacks\s*==([\s\S]*?)(?===\s*Abilities\s*==)/);
    if (attacksSection) {
      const blockRegex = /===\s*(.+?)\s*===([\s\S]*?)(?=\n===|$)/g;
      let m;
      while ((m = blockRegex.exec(attacksSection[1])) !== null) {
        const atkName = m[1].trim();
        const body = m[2];
        const costMatch = body.match(/Cost:\s*(\S+)/i);
        const rangeMatch = body.match(/Range:\s*(\S+)/i);
        const strengthMatch = body.match(/Strength:\s*(\S+)/i);

        const effects = [];
        const effectMatch = body.match(/Effect:\s*([\s\S]*?)$/i);
        if (effectMatch) {
          const effectText = effectMatch[1].trim();
          const effectLines = effectText.split("\n").map(l => l.trim()).filter(l => l);
          effectLines.forEach(l => effects.push(l));
        }
        if (effects.length === 0) effects.push("");

        unit.attacks.push({
          name: atkName,
          cost: costMatch ? costMatch[1] : "",
          range: rangeMatch ? rangeMatch[1] : "",
          strength: strengthMatch ? strengthMatch[1] : "",
          sp_shape: "",
          effects,
        });
      }
    }
    if (unit.attacks.length === 0) unit.attacks.push({ ...EMPTY_ATTACK, effects: [""] });

    // Parse abilities section
    const abilitiesSection = text.match(/==\s*Abilities\s*==([\s\S]*?)(?=\[\[Category|$)/);
    if (abilitiesSection) {
      const blockRegex = /===\s*(.+?)\s*===([\s\S]*?)(?=\n===|$)/g;
      let m2;
      while ((m2 = blockRegex.exec(abilitiesSection[1])) !== null) {
        const abName = m2[1].trim();
        const bodyLines = m2[2].trim().split("\n").map(l => l.trim()).filter(l => l);
        
        let keywords = "";
        let descLines = [];
        let foundDesc = false;
        for (const line of bodyLines) {
          if (!foundDesc && /^\[.+\]$/.test(line.replace(/\]\s*\[/g, "]["))) {
            keywords = keywords ? keywords + line : line;
          } else {
            foundDesc = true;
            descLines.push(line);
          }
        }
        
        unit.abilities.push({
          name: abName,
          keywords: keywords,
          description: descLines.join("\n"),
        });
      }
    }

    return unit;
  } catch (e) {
    return null;
  }
}

// Colors for bracketed keywords on the card preview. Match is case-insensitive
// and by prefix, so "Range" also covers "[Range 3]". Edit freely.
const KEYWORD_COLORS = [
  { match: ["Command"],            color: "#2E2A80" },
  { match: ["Energy"],             color: "#EFC900" },
  { match: ["After Attack Roll"],  color: "#5BBB00" },
  { match: ["Before Attack Roll"], color: "#CD008B" },
  { match: ["After Combat Damage"], color: "#CD008B" },
  { match: ["Strength"],           color: "#B80B26" },
  { match: ["Critical"],           color: "#EB0000" },
  { match: ["Setup"],              color: "#009CE7" },
  { match: ["Disarm"],             color: "#8D008E" },
  { match: ["Shield"],             color: "#0081AD" },
  { match: ["Response"],           color: "#F45900" },
  { match: ["Ongoing"],            color: "#2E7D32" },
];
const KEYWORD_DEFAULT = "#6b6b6b";

// Images shown on the card when an attack's Range is "SP". Add more shapes here.
const SP_IMAGES = {
  Hammer: "https://steamusercontent-a.akamaihd.net/ugc/11484250575847956359/07E221E27C8F9A8A77613D8A995C4AAFA41DB0BC/",
  Flower: "https://steamusercontent-a.akamaihd.net/ugc/14776739453935694354/CE36582CC5E327F312E9DABE6627B7E6B96D1F66/",
  Cone:   "https://steamusercontent-a.akamaihd.net/ugc/10642514076363748008/0613929E2B9D9E0EA4B0C0746F3821753356E441/",
};
const isSP = (range) => String(range || "").trim().toUpperCase() === "SP";

function keywordColor(inner) {
  const t = inner.trim().toLowerCase();
  for (const k of KEYWORD_COLORS) {
    if (k.match.some(m => t.startsWith(m.toLowerCase()))) return k.color;
  }
  return KEYWORD_DEFAULT;
}

function renderKeywords(text) {
  if (!text) return null;
  return String(text).split(/(\[[^\]]+\])/g).map((part, i) => {
    if (part.startsWith("[") && part.endsWith("]")) {
      return <b key={i} style={{ color: keywordColor(part.slice(1, -1)) }}>{part}</b>;
    }
    return part;
  });
}

const ICON_COST = <svg viewBox="0 0 24 24"><path d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20zm0 18a8 8 0 1 1 0-16 8 8 0 0 1 0 16zm1-13h-2v6l5 3 1-1.7-4-2.3z"/></svg>;
const ICON_RANGE = <svg viewBox="0 0 24 24"><path d="M2 11h14.2l-3.6-3.6L14 6l6 6-6 6-1.4-1.4 3.6-3.6H2z"/></svg>;
const ICON_STR = <svg viewBox="0 0 24 24"><path d="M7 11V5a1.5 1.5 0 0 1 3 0v5h1V4a1.5 1.5 0 0 1 3 0v6h1V5a1.5 1.5 0 0 1 3 0v8.5c0 3.6-2.9 6.5-6.5 6.5H10c-2.2 0-4.2-1.3-5.2-3.2L3 13.4A1.5 1.5 0 0 1 5.6 12L7 14.5z"/></svg>;

function CardPreview({ unit }) {
  const has = (v) => v && String(v).trim();
  const attacks = unit.attacks.slice(0, 2);
  const abilities = unit.abilities.slice(0, 3);
  const pilotLine = [has(unit.pilot) ? unit.pilot : null, has(unit.faction) ? unit.faction : null].filter(Boolean).join(" - ");
  return (
    <div className="card">
      <div className="card-art" style={has(unit.splash_art) ? { backgroundImage: `url("${unit.splash_art}")` } : {}} />
      <div className="card-side up" /><div className="card-side down" /><div className="card-side pin" />
      <div className="card-stats">
        <span>HP {has(unit.hp) ? unit.hp : "–"}</span>
        <span>VP {has(unit.vp) ? unit.vp : "–"}</span>
        <span>TL {has(unit.timeline) ? unit.timeline : "–"}</span>
      </div>
      <div className="card-tech">{unit.technical_name}</div>
      <div className={"card-name" + (has(unit.name) ? "" : " card-placeholder")}>{has(unit.name) ? unit.name : "Unit Name"}</div>
      <div className="card-pilot">{pilotLine}</div>

      {attacks.map((a, i) => (
        <div className={`card-atk a${i + 1}`} key={i}>
          <div className={"card-atk-name" + (has(a.name) ? "" : " card-placeholder")}>{has(a.name) ? a.name : "Attack"}</div>
          <div className="card-pips">
            <div className="card-pip">{ICON_COST}<span>{a.cost}</span></div>
            <div className="card-pip">{ICON_RANGE}<span>{a.range}</span></div>
            <div className="card-pip">{ICON_STR}<span>{a.strength}</span></div>
          </div>
          <div className={"card-atk-body" + (isSP(a.range) ? " sp" : "")}>
            <div className="card-atk-fx">
              {a.effects.filter(has).map((e, j) => <div key={j}>{renderKeywords(e)}</div>)}
            </div>
            {isSP(a.range) && (
              <div className="card-atk-sp">
                {SP_IMAGES[a.sp_shape]
                  ? <img src={SP_IMAGES[a.sp_shape]} alt={a.sp_shape} />
                  : <div className="card-atk-sp-empty">{a.sp_shape || "SP"}</div>}
              </div>
            )}
          </div>
        </div>
      ))}

      {abilities.map((ab, i) => (
        <div className={`card-ab b${i + 1}`} key={i}>
          <div className="card-ab-name">{ab.name}</div>
          <div className="card-ab-kw">{renderKeywords(ab.keywords)}</div>
          <div className="card-ab-desc">{renderKeywords(ab.description)}</div>
        </div>
      ))}
    </div>
  );
}

// --- IndexedDB persistence (art is stored as base64, so localStorage is too small) ---
const tcDB = {
  open() {
    return new Promise((res, rej) => {
      const r = indexedDB.open("gundam-assemble", 1);
      r.onupgradeneeded = () => r.result.createObjectStore("kv");
      r.onsuccess = () => res(r.result);
      r.onerror = () => rej(r.error);
    });
  },
  async get(k) {
    try {
      const db = await this.open();
      return await new Promise((res, rej) => {
        const q = db.transaction("kv").objectStore("kv").get(k);
        q.onsuccess = () => res(q.result); q.onerror = () => rej(q.error);
      });
    } catch (e) { return undefined; }
  },
  async set(k, v) {
    try {
      const db = await this.open();
      await new Promise((res, rej) => {
        const tx = db.transaction("kv", "readwrite");
        tx.objectStore("kv").put(v, k);
        tx.oncomplete = res; tx.onerror = () => rej(tx.error);
      });
    } catch (e) { console.warn("save failed", e); }
  },
};

// Downscale uploaded art so the library stays a reasonable size. 1800px is plenty for a 1500px-wide print.
function tcLoadArtFile(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = (ev) => {
      const img = new Image();
      img.onload = () => {
        const MAX = 1800;
        const s = Math.min(1, MAX / Math.max(img.naturalWidth, img.naturalHeight));
        const w = Math.round(img.naturalWidth * s), h = Math.round(img.naturalHeight * s);
        const c = document.createElement("canvas"); c.width = w; c.height = h;
        c.getContext("2d").drawImage(img, 0, 0, w, h);
        resolve({ art: c.toDataURL("image/jpeg", 0.88), artW: w, artH: h });
      };
      img.onerror = reject;
      img.src = ev.target.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

// Cover-fit the art in the art window, then apply zoom + pan (clamped so no gaps show).
function tcArtLayout(card) {
  if (!card.art || !card.artW || !card.artH) return null;
  const base = Math.max(TC_ART_W / card.artW, TC_ART_H / card.artH);
  const scale = base * ((card.artZoom || 100) / 100);
  const iw = card.artW * scale, ih = card.artH * scale;
  const minL = TC_ART_W - iw, minT = TC_ART_H - ih;
  const left = Math.min(0, Math.max(minL, (TC_ART_W - iw) / 2 + (card.artX || 0)));
  const top  = Math.min(0, Math.max(minT, (TC_ART_H - ih) / 2 + (card.artY || 0)));
  return { width: iw, height: ih, left, top };
}

function renderPills(text) {
  if (!text) return null;
  return String(text).split(/(\[[^\]]+\])/g).map((part, i) => {
    if (part.startsWith("[") && part.endsWith("]")) {
      return <span key={i} className="kw" style={{ "--kw": keywordColor(part.slice(1, -1)) }}><span>{part.slice(1, -1)}</span></span>;
    }
    return part;
  });
}

// Icons are rendered as <img> with an SVG data URI: html2canvas (PNG export) handles those reliably, inline <svg> not.
function svgImg(path, color, size, vb = 24, extra = {}) {
  const src = "data:image/svg+xml;utf8," + encodeURIComponent(`<svg xmlns='http://www.w3.org/2000/svg' width='${vb * 4}' height='${vb * 4}' viewBox='0 0 ${vb} ${vb}' fill='${color}'><path d='${path}'/></svg>`);
  return <img src={src} alt="" draggable={false} style={{ width: size, height: size, display: "block", ...extra }} />;
}

function tcBoxClass(card) {
  const style = card.boxStyle || "auto";
  if (card.type === "attack") return "attack";
  if (style === "color") return "";
  if (style === "dark") return "dark";
  return card.scenario && card.scenario.trim() ? "" : "dark";
}

// Shrinks the text until it fits inside the box. Re-runs when the card changes and once web fonts finish loading.
function useFitText(ref, boxRef, deps, max = 11, min = 7) {
  const [fontsReady, setFontsReady] = useState(false);
  useEffect(() => { if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => setFontsReady(true)); }, []);
  React.useLayoutEffect(() => {
    const el = ref.current, box = boxRef.current; if (!el || !box) return;
    const padB = parseFloat(getComputedStyle(box).paddingBottom) || 0;
    const avail = box.clientHeight - padB - el.offsetTop;
    let lo = min, hi = max;
    for (let i = 0; i < 12; i++) {
      const mid = (lo + hi) / 2;
      el.style.fontSize = mid + "px";
      if (el.scrollHeight <= avail) lo = mid; else hi = mid;
    }
    el.style.fontSize = lo + "px";
  }, [...deps, fontsReady]);
}

function TacticsCard({ card, interactive, onArtDrag }) {
  const has = (v) => v && String(v).trim();
  const layout = tcArtLayout(card);
  const boxRef = useRef();
  const fitRef = useRef();
  const nameRef = useRef();
  // Long names shrink to fit (html2canvas can't render text-overflow ellipsis).
  React.useLayoutEffect(() => {
    const el = nameRef.current; if (!el) return;
    let size = 24; el.style.fontSize = size + "px";
    while (el.scrollWidth > el.clientWidth && size > 12) { size -= 0.5; el.style.fontSize = size + "px"; }
  }, [card.name]);
  const dragRef = useRef(null);
  const isAtk = card.type === "attack";
  const atk = card.attack || EMPTY_TCARD.attack;
  const scenario = has(card.scenario) ? card.scenario : "";
  const boxCls = tcBoxClass(card);

  useFitText(fitRef, boxRef, [card.effect, card.scenario, card.type, atk.name, atk.cost, atk.range, atk.strength, atk.sp_shape, JSON.stringify(atk.effects)], isAtk ? 10.5 : 11.5, 7);

  const onDown = (e) => {
    if (!interactive || !card.art) return;
    dragRef.current = { x: e.clientX, y: e.clientY, ax: card.artX || 0, ay: card.artY || 0 };
    e.currentTarget.setPointerCapture(e.pointerId);
  };
  const onMove = (e) => {
    if (!dragRef.current) return;
    const d = dragRef.current;
    onArtDrag && onArtDrag(d.ax + (e.clientX - d.x), d.ay + (e.clientY - d.y));
  };
  const onUp = () => { dragRef.current = null; };

  const scenarioEl = scenario ? <div className="tcard-scenario">{renderPills(scenario)}</div> : null;

  return (
    <div className={`tcard ${card.type}`}>
      <div className="tcard-inner">
        <div className={"tcard-art" + (interactive && card.art ? " drag" : "")}
             onPointerDown={onDown} onPointerMove={onMove} onPointerUp={onUp} onPointerCancel={onUp}>
          {layout
            ? <img src={card.art} alt="" style={{ width: layout.width, height: layout.height, left: layout.left, top: layout.top }} draggable={false} />
            : <div className="tcard-art-empty">{interactive ? "UPLOAD ART" : "NO ART"}</div>}
        </div>
        <div className="tcard-banner">{tcIcon(card.type, 13)}<span>{TC_TYPES[card.type]}</span></div>

        <div className={"tcard-box " + boxCls} ref={boxRef} style={scenario ? { paddingBottom: 22 } : {}}>
          {isAtk ? (
            <React.Fragment>
              <div className="tcard-atk-head">
                <div className="tcard-atk-name">{has(atk.name) ? atk.name : "Weapon"}</div>
                <div className="tcard-atk-stat">{tcIcon("cost", 16)}<span>{has(atk.cost) ? atk.cost : "–"}</span></div>
                <div className="tcard-atk-stat">{tcIcon("range", 16)}<span>{has(atk.range) ? atk.range : "–"}</span></div>
                <div className="tcard-atk-stat">{tcIcon("strength", 16)}<span>{has(atk.strength) ? atk.strength : "–"}</span></div>
              </div>
              <div className="tcard-atk-body">
                <div className="tcard-atk-fx" ref={fitRef}>
                  {(atk.effects || []).filter(has).map((e, i) => <div key={i}>{renderPills(e)}</div>)}
                </div>
                {isSP(atk.range) && (
                  <div className="tcard-atk-sp">
                    {SP_IMAGES[atk.sp_shape] ? <img src={SP_IMAGES[atk.sp_shape]} alt={atk.sp_shape} /> : <span>{atk.sp_shape || "SP"}</span>}
                  </div>
                )}
              </div>
            </React.Fragment>
          ) : (
            <div className="tcard-box-text" ref={fitRef}>{renderPills(card.effect)}</div>
          )}
          {scenarioEl}
        </div>

        <div className="tcard-bottom">
          {(has(card.tag1) || has(card.tag2)) && (
            <div className="tcard-tags">
              {has(card.tag1) && <div className="tcard-tag">{card.tag1}</div>}
              {has(card.tag2) && <div className="tcard-tag">{card.tag2}</div>}
            </div>
          )}
          {(has(card.cardId) || has(card.rarity)) && (
            <div className="tcard-id">{card.cardId}{has(card.rarity) && <span className="tcard-rarity">{card.rarity}</span>}</div>
          )}
          <div className="tcard-name" ref={nameRef} style={has(card.name) ? {} : { opacity: 0.3 }}>{has(card.name) ? card.name : "Card Name"}</div>
          <div className="tcard-emblem"><img src={TC_EMBLEM_SRC} alt="" draggable={false} /></div>
          {has(card.footer) && <div className="tcard-foot">{card.footer}</div>}
        </div>
      </div>
    </div>
  );
}

const tcFileName = (name) => (name || "card").replace(/[^a-z0-9]/gi, "_").replace(/_+/g, "_").replace(/^_|_$/g, "").toLowerCase() || "card";
const TC_JSON_NAME = "GundamAssembleCardData.json";
const TC_ART_DIR = "CardArt";      // source art, one file per card, referenced by the JSON
const TC_RENDER_DIR = "CardImages"; // finished card PNGs (not needed by the app; handy for TTS / printing)

// Every card gets a stable file name from its card name; duplicates get _2, _3, ...
function tcAssignFileNames(cards) {
  const used = new Set();
  return cards.map(c => {
    let base = tcFileName(c.name), n = base, i = 2;
    while (used.has(n)) n = base + "_" + i++;
    used.add(n);
    return { ...c, file: n };
  });
}
// JSON as hosted on GitHub: no base64 — art is referenced by file name inside CardArt/.
function tcLibraryJSON(cards, fmt = "webp") {
  const ext = TC_FORMATS[fmt].ext;
  const out = tcAssignFileNames(cards).map(c => {
    const { art, file, ...rest } = c;
    return { ...rest, artFile: art ? file + "." + ext : null };
  });
  return JSON.stringify({ version: 2, type: "tactics-cards", artDir: TC_ART_DIR, cards: out }, null, 2);
}
const blobToDataUrl = (blob) => new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(r.result); r.onerror = rej; r.readAsDataURL(blob); });
// Turn a loaded card record (artFile reference, or legacy base64) into a working card with a data-URI art.
async function tcHydrateCard(raw, artLoader) {
  const card = { ...JSON.parse(JSON.stringify(EMPTY_TCARD)), ...raw, _key: raw._key || generateId() };
  if (card.art && String(card.art).startsWith("data:")) return card;
  card.art = null;
  if (raw.artFile && artLoader) {
    try {
      const blob = await artLoader(raw.artFile);
      if (blob) {
        card.art = await blobToDataUrl(blob);
        if (!card.artW || !card.artH) {
          const dims = await new Promise(res => { const im = new Image(); im.onload = () => res([im.naturalWidth, im.naturalHeight]); im.onerror = () => res([0, 0]); im.src = card.art; });
          card.artW = dims[0]; card.artH = dims[1];
        }
      }
    } catch (e) { console.warn("art load failed", raw.artFile, e); }
  }
  return card;
}
const tcGithubArtLoader = async (file) => { const r = await fetch(GITHUB_CARD_ART_URL + file + "?t=" + Date.now(), { cache: "no-store" }); return r.ok ? r.blob() : null; };
const tcFolderArtLoader = (dir) => async (file) => {
  try { const sub = await dir.getDirectoryHandle(TC_ART_DIR); const fh = await sub.getFileHandle(file); return await fh.getFile(); } catch { return null; }
};

// Image format for exports (card renders and source art). Persisted with the folder choice.
const TC_FORMATS = { webp: { mime: "image/webp", ext: "webp", q: 0.92 }, png: { mime: "image/png", ext: "png", q: undefined }, jpg: { mime: "image/jpeg", ext: "jpg", q: 0.9 } };
const canvasToBlob = (canvas, fmt) => new Promise(res => canvas.toBlob(res, TC_FORMATS[fmt].mime, TC_FORMATS[fmt].q));
async function tcRenderCanvas(el) {
  return html2canvas(el, {
    scale: TC_EXPORT_SCALE, useCORS: true, allowTaint: true, backgroundColor: null, logging: false, width: TC_W, height: TC_H,
    onclone: (doc) => doc.querySelectorAll(".tcard").forEach(n => n.classList.add("exporting")),
  });
}
async function tcRenderCard(el, fmt = "webp") {
  return canvasToBlob(await tcRenderCanvas(el), fmt);
}

// --- Card sheets (Tabletop Simulator deck images) ---
// Up to a 10 x 7 grid of 750x1050 cards (7500x7350 max; empty rows at the bottom are trimmed). Each set's cards fill the grid in order and the card back
// goes in the slot right after the last card, so one sheet holds up to 69 cards (bigger sets get _2, _3 ...).
const TC_SHEET_COLS = 10, TC_SHEET_ROWS = 7, TC_SHEET_CW = 750, TC_SHEET_CH = 1050;
